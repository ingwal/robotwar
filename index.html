<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot War</title>
<link rel="icon" href="favicon.ico">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cdd6e4; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud { position: fixed; left: 12px; top: 10px; padding: 6px 10px; border-radius: 8px;
         background: rgba(255, 255, 255, 0.65); color: #2a3347; font-size: 13px; user-select: none; }
  #msg { position: fixed; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none;
         color: #2a3347; font-size: 48px; font-weight: 800; text-shadow: 0 2px 0 #fff; }
  .panel { background: rgba(255, 255, 255, 0.92); color: #2a3347; border-radius: 14px;
           box-shadow: 0 8px 30px rgba(30, 40, 70, 0.25); }
  #setup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px;
           max-height: calc(100vh - 40px); overflow-y: auto; }
  #setup[hidden] { display: none; }
  #setup h2 { margin: 0 0 14px; font-size: 20px; }
  .config-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e0e5ef; }
  .config-row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .config-row label { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .config-row input[type=range] { accent-color: #2a3347; width: 110px; }
  .config-row select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid #b8c2d4; background: #fff; }
  .mode-row { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
  .count-row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .count-row label { display: flex; align-items: center; gap: 8px; }
  .count-row input[type=number] { width: 50px; font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid #b8c2d4; }
  .team-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .team-id { display: flex; align-items: center; gap: 8px; min-width: 72px; padding-top: 7px;
             font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.65; flex-shrink: 0; }
  .team-selects { display: flex; gap: 10px; align-items: center; }
  .slot { display: grid; grid-template-columns: 18px 70px 1fr; gap: 4px 10px; align-items: center; margin-bottom: 12px; }
  .slot small { grid-column: 3; color: #5a6478; font-size: 12px; line-height: 1.35; }
  .slot select, .team-selects select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid #b8c2d4; background: #fff; }
  .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 1px solid #b8c2d4;
           background: #fff; color: #2a3347; cursor: pointer; }
  button.primary { background: #2a3347; border-color: #2a3347; color: #fff; }
  #board { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; font-size: 13px; user-select: none; }
  #board div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #board .dead { opacity: 0.4; text-decoration: line-through; }
  #board .hp { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  #board .team-header { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-top: 5px; }
  #board .eye { all: unset; cursor: pointer; font-size: 14px; opacity: 0.3; margin-left: 4px; line-height: 1; }
  #board .eye:hover, #board .eye.watching { opacity: 1; }
  #eyepanel { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 260px;
              pointer-events: none; z-index: 10; display: flex; flex-direction: column; gap: 8px;
              overflow: hidden; }
  .eyeslot-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                 background: rgba(255,255,255,0.9); color: #2a3347; border-radius: 8px 8px 0 0;
                 padding: 4px 10px; font-size: 12px; font-weight: 600; pointer-events: auto; }
  .eyeslot-bar button { all: unset; cursor: pointer; font-size: 13px; opacity: 0.5; }
  .eyeslot-bar button:hover { opacity: 1; }
  .eyeslot-port { height: 160px; border-radius: 0 0 8px 8px; flex-shrink: 0;
                  box-shadow: 0 6px 24px rgba(0,0,0,0.4), inset 0 0 0 1.5px rgba(255,255,255,0.2); }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
             width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px; z-index: 20; }
  #results[hidden] { display: none; }
  #results h2 { margin: 0 0 16px; font-size: 20px; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 0;
                border-bottom: 1px solid #e0e5ef; }
  .result-row:last-child { border-bottom: none; }
  .result-place { font-size: 13px; font-weight: 700; width: 28px; text-align: right;
                  color: #888; flex-shrink: 0; }
  .result-place.gold   { color: #b8860b; }
  .result-place.silver { color: #888; }
  .result-place.bronze { color: #a0522d; }
  .result-name { flex: 1; font-weight: 600; font-size: 14px; }
  .result-stat { font-size: 13px; color: #5a6478; white-space: nowrap; }
  .result-stat.elim { color: #c04040; }
  #rseditor { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
              width: min(580px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px; z-index: 30; }
  #rseditor[hidden] { display: none; }
  #rseditor h2 { margin: 0 0 14px; font-size: 20px; }
  #rseditor-name { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
                   padding: 5px 8px; border-radius: 6px; border: 1px solid #b8c2d4; margin-bottom: 10px; }
  #rseditor-src { width: 100%; box-sizing: border-box; height: 280px;
                  font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.5;
                  padding: 8px; border-radius: 6px; border: 1px solid #b8c2d4; resize: vertical; }
  #rseditor-error { color: #c04040; font-size: 12px; margin-top: 6px; min-height: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Robot War</b> · drag to orbit · scroll to zoom · space to pause · Esc to stop · M to mute · click once to enable sound</div>
<div id="msg"></div>
<div id="board" class="panel"></div>
<div id="eyepanel"></div>
<div id="results" class="panel" hidden>
  <h2 id="results-title">Battle Results</h2>
  <div id="results-table"></div>
  <div class="buttons"><button id="results-ok" class="primary">New Battle</button></div>
</div>
<div id="rstoast" hidden style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
     background:#1e2d45;color:#fff;padding:10px 20px;border-radius:10px;
     font-size:14px;z-index:50;pointer-events:none;white-space:nowrap"></div>
<div id="rseditor" class="panel" hidden>
  <h2>RoboScript Bot <a href="roboscript-reference.html" target="_blank" style="font-size:13px;font-weight:400;margin-left:10px;vertical-align:middle">Language reference ↗</a></h2>
  <input id="rseditor-name" type="text" placeholder="Bot name">
  <textarea id="rseditor-src" spellcheck="false" autocorrect="off" autocapitalize="off"
            placeholder="-- write your RoboScript here&#10;-- click Language reference ↗ above for docs and examples"></textarea>
  <div id="rseditor-error"></div>
  <div class="buttons">
    <button id="rseditor-share" style="margin-right:auto">Share link</button>
    <button id="rseditor-cancel">Cancel</button>
    <button id="rseditor-add" class="primary">Add Bot</button>
  </div>
</div>
<div id="setup" class="panel">
  <h2>Robot War</h2>
  <div class="config-section">
    <div class="config-row">
      <label>Arena: <span id="arenaVal">14</span>
        <input type="range" id="arenaSize" min="10" max="30" value="14" step="1">
      </label>
      <label>Shots to kill: <input type="number" id="shotsToKill" min="1" max="10" value="6"></label>
      <label>Land mines: <input type="number" id="mineCount" min="0" max="30" value="0"></label>
      <label>Mine strength:
        <select id="mineDamage">
          <option value="1">Weak (1 hit)</option>
          <option value="2" selected>Normal (2 hits)</option>
          <option value="4">Strong (4 hits)</option>
          <option value="0">Deadly</option>
        </select>
      </label>
      <label>Obstacles:
        <select id="layoutPick">
          <option value="open">Open</option>
          <option value="cross" selected>Cross</option>
          <option value="fourRooms">Four Rooms</option>
          <option value="pillars">Pillars</option>
          <option value="maze">Maze</option>
          <option value="downtown">Downtown</option>
        </select>
      </label>
      <label>Ground:
        <select id="groundPick">
          <option value="checker" selected>Checkerboard</option>
          <option value="grass">Grass</option>
          <option value="asphalt">Asphalt</option>
          <option value="concrete">Concrete</option>
        </select>
      </label>
      <label>Wall strength:
        <select id="wallHp">
          <option value="1">Flimsy (1 hit)</option>
          <option value="2" selected>Normal (2 hits)</option>
          <option value="4">Sturdy (4 hits)</option>
          <option value="8">Tough (8 hits)</option>
          <option value="0">Indestructible</option>
        </select>
      </label>
    </div>
  </div>
  <div class="mode-row">
    <label><input type="checkbox" id="teamsMode"> Teams mode</label>
    <label><input type="checkbox" id="radioEnabled" checked> Radio</label>
  </div>
  <div id="noTeamsSection">
    <div class="count-row">
      <label>Robots: <input type="number" id="robotCount" min="1" max="8" value="4"></label>
    </div>
    <div id="slots"></div>
  </div>
  <div id="teamsSection" hidden>
    <div class="count-row">
      <label>Teams: <input type="number" id="teamCount" min="2" max="4" value="2"></label>
      <label>Robots per team: <input type="number" id="robotsPerTeam" min="1" max="4" value="2"></label>
    </div>
    <div id="teamSlots"></div>
  </div>
  <div class="buttons">
    <button id="rseditor-open" style="margin-right:auto">RoboScript…</button>
    <button id="shuffle">Shuffle</button>
    <button id="fight" class="primary">Fight!</button>
  </div>
</div>
<script src="robot.js?v=2"></script>
<script src="strategies.js?v=2"></script>
<script src="roboscript.js?v=2"></script>
<script src="roboscript-compiler.js?v=2"></script>
<script>
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true });
if (!gl) throw new Error('WebGL2 not supported');
const gfx = RobotGfx.create(gl);
const { mat4 } = RobotGfx;

// ---------- constants ----------
const MAX_HP = 6;
const MAX_SPEED = 1.8;
const BULLET_SPEED = 16;
const ROUND_TIME = 180;
const DEATH_TIME = 0.7;
const ROBOT_RADIUS = 0.7;
const MINE_DAMAGE_CHOICES = [1, 2, 4, 0]; // hits a blast deals to robots and wall blocks; 0 = deadly
const MINE_BLAST = 2.2;     // blast radius
const MINE_TRIGGER = 0.8;   // a robot this close to a mine sets it off

const HOWITZER_SPEED = 20;     // muzzle velocity (units/s)
const HOWITZER_GRAVITY = 10;   // gravity (units/s²) — no air resistance
const HOWITZER_BLAST = 3.0;    // landing explosion radius
const HOWITZER_COOLDOWN = 5;   // reload time (seconds)

const TEAMS = [
  { name: 'Coral',  color: [1.0,  0.45, 0.40] },
  { name: 'Teal',   color: [0.25, 0.75, 0.72] },
  { name: 'Sunny',  color: [1.0,  0.75, 0.25] },
  { name: 'Violet', color: [0.60, 0.50, 0.95] },
  { name: 'Lime',   color: [0.50, 0.92, 0.22] },
  { name: 'Azure',  color: [0.22, 0.52, 1.0]  },
  { name: 'Rose',   color: [1.0,  0.35, 0.68] },
  { name: 'Amber',  color: [1.0,  0.58, 0.08] },
];

// Wall layouts as fractions of ARENA so they scale with arena size.
// Each entry is [fx0, fz0, fx1, fz1] where 1.0 = ARENA half-width.
const WALL_LAYOUTS = {
  open: [],
  cross: [
    [-0.5,   -0.25,  -0.443,  0.25 ],
    [ 0.443, -0.25,   0.5,    0.25 ],
    [-0.25,  -0.5,    0.25,  -0.443],
    [-0.25,   0.443,  0.25,   0.5  ],
    [-0.071, -0.071,  0.071,  0.071],
  ],
  fourRooms: [
    [-1.0,  -0.036, -0.15,  0.036],
    [ 0.15, -0.036,  1.0,   0.036],
    [-0.036,  0.15,  0.036, 1.0  ],
    [-0.036, -1.0,   0.036,-0.15 ],
  ],
  pillars: [
    [-0.6,  -0.6,  -0.5,  -0.5 ],
    [ 0.5,  -0.6,   0.6,  -0.5 ],
    [-0.6,   0.5,  -0.5,   0.6 ],
    [ 0.5,   0.5,   0.6,   0.6 ],
    [-0.071,-0.071,  0.071, 0.071],
    [ 0.3,  -0.15,  0.4,   0.15 ],
  ],
  maze: [
    [-0.7,  -0.036,  0.1,   0.036],
    [ 0.3,  -0.036,  0.7,   0.036],
    [-0.1,  -0.7,    0.036,-0.15 ],
    [-0.036,  0.2,   0.1,   0.7  ],
    [ 0.4,   0.3,    0.5,   0.7  ],
    [-0.5,  -0.65,  -0.4,  -0.3  ],
  ],
};

// Each wall is cut into roughly 1x1 blocks that can be shot to pieces one at a time.
// wallHp is the number of hits a block takes; 0 makes walls indestructible.
const WALL_HP_CHOICES = [1, 2, 4, 8, 0];
const BLOCK_SIZE = 1;
function buildWalls(layoutKey, arena, wallHp = 2) {
  const blocks = [];
  const addBox = (x0, z0, x1, z1, extra) => {
    const nx = Math.max(1, Math.round((x1 - x0) / BLOCK_SIZE)), nz = Math.max(1, Math.round((z1 - z0) / BLOCK_SIZE));
    if (extra?.building) Object.assign(extra.building, { x0, z0, x1, z1, blocks: nx * nz });
    for (let i = 0; i < nx; i++)
      for (let j = 0; j < nz; j++)
        blocks.push({
          x0: x0 + ((x1 - x0) * i) / nx, x1: x0 + ((x1 - x0) * (i + 1)) / nx,
          z0: z0 + ((z1 - z0) * j) / nz, z1: z0 + ((z1 - z0) * (j + 1)) / nz,
          hp: wallHp || Infinity, maxHp: wallHp, seed: Math.random() * 10, ...extra,
        });
  };
  if (layoutKey === 'downtown') buildDowntown(arena, addBox);
  else for (const [fx0, fz0, fx1, fz1] of WALL_LAYOUTS[layoutKey] ?? []) addBox(fx0 * arena, fz0 * arena, fx1 * arena, fz1 * arena);
  return blocks;
}

// A city centre: streets of uneven width (including one all the way round the edge) with city
// blocks of uneven size between them, some joined across a street. Each block is split into
// buildings of different sizes, heights and kinds; some stand back from the street, and now
// and then a lot or a whole block is left open as a square. Seeded by the arena size, so the city
// in the setup preview is the one you fight in.
// Each kind has a facade photo (textures/, CC0 from ambientCG); tile is how many world units
// one copy of the photo covers, so that a storey is about 0.9 units on every kind. color is the
// photo's average, used for falling debris.
const BUILDING_KINDS = [
  { tex: 'facade-brick.jpg',        tile: 5.4,  color: [0.43, 0.41, 0.41], minH: 1.6, maxH: 2.8 },
  { tex: 'facade-concrete.jpg',     tile: 5.4,  color: [0.35, 0.36, 0.37], minH: 2.2, maxH: 4.2 },
  { tex: 'facade-white-office.jpg', tile: 7.2,  color: [0.46, 0.5, 0.5],   minH: 1.8, maxH: 3.6 },
  { tex: 'facade-glass.jpg',        tile: 9,    color: [0.27, 0.3, 0.33],  minH: 3.2, maxH: 5.5 },
  { tex: 'facade-dark-office.jpg',  tile: 28.8, color: [0.37, 0.33, 0.31], minH: 2.6, maxH: 4.6 },
];
const STREET = 3.2;
// Floor choices; tile is how many world units one copy of the photo covers (CC0, ambientCG).
const GROUND_KINDS = {
  checker: null,
  grass:    { tex: 'ground-grass.jpg',    tile: 4 },
  asphalt:  { tex: 'ground-asphalt.jpg',  tile: 4 },
  concrete: { tex: 'ground-concrete.jpg', tile: 4 },
};

// One texture array holds every photo: the facades first (layer = building kind), then the grounds.
const TEXTURE_FILES = BUILDING_KINDS.map((k) => k.tex);
for (const g of Object.values(GROUND_KINDS)) if (g) g.layer = TEXTURE_FILES.push(g.tex) - 1;
gfx.loadTextures(TEXTURE_FILES.map((f) => 'textures/' + f));

function buildDowntown(arena, addBox) {
  let seed = 1013904223 + arena * 7919;
  const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const range = (a, b) => a + rand() * (b - a);

  // Cut one axis into city blocks of uneven width, with streets of uneven width between them
  // (now and then a wide avenue). Each axis is cut on its own, so the grid doesn't line up.
  const cutAxis = () => {
    const lo = -arena + STREET, inner = 2 * (arena - STREET);
    const n = Math.max(1, Math.round((inner + 3.4) / (6.5 + 3.4)));
    const streets = Array.from({ length: n - 1 }, () => (rand() < 0.2 ? range(4.4, 5.2) : range(2.6, 3.8)));
    const weights = Array.from({ length: n }, () => range(0.4, 2));
    const room = inner - streets.reduce((a, b) => a + b, 0), wsum = weights.reduce((a, b) => a + b, 0);
    const spans = [];
    let a = lo;
    for (let i = 0; i < n; i++) {
      const w = (room * weights[i]) / wsum;
      spans.push([a, a + w]);
      a += w + (streets[i] ?? 0);
    }
    return spans;
  };
  const xs = cutAxis(), zs = cutAxis();

  // City blocks, some merged with a neighbour across the street between them so that street
  // ends in a T. A block merges at most once, so no crossing loses all its streets.
  const merged = new Set(), blocks = [];
  for (let i = 0; i < xs.length; i++)
    for (let j = 0; j < zs.length; j++) {
      if (merged.has(i + ',' + j)) continue;
      let [x0, x1] = xs[i], [z0, z1] = zs[j];
      if (rand() < 0.25) {
        const right = i + 1 < xs.length && !merged.has(i + 1 + ',' + j);
        const down = j + 1 < zs.length && !merged.has(i + ',' + (j + 1));
        if (right && (!down || rand() < 0.5)) { x1 = xs[i + 1][1]; merged.add(i + 1 + ',' + j); }
        else if (down) { z1 = zs[j + 1][1]; merged.add(i + ',' + (j + 1)); }
      }
      blocks.push([x0, z0, x1, z1]);
    }

  // Split a block into lots: cut the longer side somewhere between a third and two thirds,
  // again and again while the pieces are big enough.
  const lots = [];
  const split = (x0, z0, x1, z1, depth) => {
    const w = x1 - x0, d = z1 - z0, long = Math.max(w, d);
    if (long < 4.6 || (depth > 0 && rand() < 0.3) || depth > 3) { lots.push([x0, z0, x1, z1]); return; }
    const t = range(Math.max(0.3, 2.2 / long), Math.min(0.7, 1 - 2.2 / long)); // no lot thinner than 2.2
    if (w >= d) { const m = x0 + w * t; split(x0, z0, m, z1, depth + 1); split(m, z0, x1, z1, depth + 1); }
    else { const m = z0 + d * t; split(x0, z0, x1, m, depth + 1); split(x0, m, x1, z1, depth + 1); }
  };
  for (const b of blocks) {
    if (rand() < 0.07) continue; // a whole block left open as a square
    split(...b, 0);
  }

  for (let [x0, z0, x1, z1] of lots) {
    if (rand() < 0.08) continue; // empty lot
    // Some buildings stand back from the street on a side or two, if they stay big enough.
    const back = (len) => (len > 3 && rand() < 0.25 ? range(0.3, 0.7) : 0);
    const bx = x1 - x0, bz = z1 - z0;
    x0 += back(bx); x1 -= back(bx); z0 += back(bz); z1 -= back(bz);
    const k = Math.floor(rand() * BUILDING_KINDS.length), kind = BUILDING_KINDS[k];
    const h = kind.minH + rand() * (kind.maxH - kind.minH);
    const shade = 0.9 + rand() * 0.2;
    addBox(x0, z0, x1, z1, {
      h, color: kind.color.map((v) => Math.min(1, v * shade)),
      facade: { layer: k, tile: kind.tile, tint: Math.min(1.1, 1.05 * shade) },
      building: {}, // shared by all its blocks; lets the renderer draw it whole while undamaged
    });
  }
}

let ARENA = 14;
let RADAR_RANGE = ARENA * 2 * Math.SQRT2;
let WALLS = buildWalls('cross', ARENA);

const STRATEGY_KEYS = Object.keys(Strategies);

let config = {
  arenaSize: 14, layout: 'cross', shotsToKill: 6, wallHp: 2, mineCount: 0, mineDamage: 2, ground: 'checker',
  teamsMode: false, radioEnabled: true,
  robotCount: 4,
  strategies: ['rambo', 'pacer', 'sniper', 'hunter'],
  teamCount: 2, robotsPerTeam: 2,
  teamStrategies: [['rambo', 'pacer'], ['sniper', 'hunter']],
};
// Copy over whatever is valid in saved (from this browser's storage or from the address);
// anything missing or out of range keeps its current value.
function applySaved(saved) {
  if (!saved || typeof saved !== 'object') return;
  const isStrategy = (k) => typeof k === 'string' && Object.hasOwn(Strategies, k);
  if (saved.arenaSize >= 10 && saved.arenaSize <= 30) config.arenaSize = saved.arenaSize | 0;
  if (Object.hasOwn(WALL_LAYOUTS, saved.layout) || saved.layout === 'downtown') config.layout = saved.layout;
  if (saved.shotsToKill >= 1 && saved.shotsToKill <= 10) config.shotsToKill = saved.shotsToKill | 0;
  if (WALL_HP_CHOICES.includes(saved.wallHp)) config.wallHp = saved.wallHp;
  if (saved.mineCount >= 0 && saved.mineCount <= 30) config.mineCount = saved.mineCount | 0;
  if (MINE_DAMAGE_CHOICES.includes(saved.mineDamage)) config.mineDamage = saved.mineDamage;
  if (Object.hasOwn(GROUND_KINDS, saved.ground)) config.ground = saved.ground;
  if (typeof saved.teamsMode === 'boolean') config.teamsMode = saved.teamsMode;
  if (typeof saved.radioEnabled === 'boolean') config.radioEnabled = saved.radioEnabled;
  if (saved.robotCount >= 1 && saved.robotCount <= 8) config.robotCount = saved.robotCount | 0;
  if (Array.isArray(saved.strategies))
    config.strategies = saved.strategies.slice(0, 8).map((k) => (isStrategy(k) ? k : STRATEGY_KEYS[0]));
  if (saved.teamCount >= 2 && saved.teamCount <= 4) config.teamCount = saved.teamCount | 0;
  if (saved.robotsPerTeam >= 1 && saved.robotsPerTeam <= 4) config.robotsPerTeam = saved.robotsPerTeam | 0;
  if (Array.isArray(saved.teamStrategies))
    config.teamStrategies = saved.teamStrategies.slice(0, 4).map((arr) =>
      Array.isArray(arr) ? arr.slice(0, 4).map((k) => (isStrategy(k) ? k : STRATEGY_KEYS[0])) : []
    );
}

// ---------- settings in the address ----------
// The setup is mirrored in the page's address, so a battle can be bookmarked or shared:
//   ?arena=14&layout=downtown&ground=grass&shots=6&walls=2&mines=5&blast=2&robots=rambo,norden,sniper
//   ?...&mode=teams&teams=rambo,pacer.sniper,hunter        (one team after another, split by ".")
// walls=0 is indestructible, blast=0 deadly, radio=0 turns team radio off. An address with settings wins over what this
// browser remembered.
function configToQuery(c) {
  const p = [['arena', c.arenaSize], ['layout', c.layout], ['ground', c.ground], ['shots', c.shotsToKill],
    ['walls', c.wallHp], ['mines', c.mineCount], ['blast', c.mineDamage], ['radio', c.radioEnabled ? 1 : 0]];
  if (c.teamsMode)
    p.push(['mode', 'teams'], ['teams', c.teamStrategies.slice(0, c.teamCount).map((t) => t.slice(0, c.robotsPerTeam).join(',')).join('.')]);
  else p.push(['robots', c.strategies.slice(0, c.robotCount).join(',')]);
  return p.map(([k, v]) => k + '=' + encodeURIComponent(v).replace(/%2C/g, ',')).join('&');
}

function configFromQuery(search) {
  const q = new URLSearchParams(search), c = {};
  const num = (k) => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : undefined);
  c.arenaSize = num('arena'); c.shotsToKill = num('shots'); c.wallHp = num('walls');
  c.mineCount = num('mines'); c.mineDamage = num('blast');
  c.layout = q.get('layout') ?? undefined; c.ground = q.get('ground') ?? undefined;
  if (q.has('mode')) c.teamsMode = q.get('mode') === 'teams';
  if (q.has('radio')) c.radioEnabled = q.get('radio') !== '0';
  if (q.get('robots')) { c.strategies = q.get('robots').split(','); c.robotCount = c.strategies.length; }
  if (q.get('teams')) {
    c.teamStrategies = q.get('teams').split('.').map((t) => t.split(','));
    c.teamCount = c.teamStrategies.length;
    c.robotsPerTeam = Math.max(...c.teamStrategies.map((t) => t.length));
  }
  return c;
}

try { applySaved(JSON.parse(localStorage.getItem('robotwar.config'))); } catch {}
applySaved(configFromQuery(location.search));

let phase = 'setup';
let robots = [], bullets = [], explosions = [], impacts = [], crumbles = [], mines = [], radioPulses = [], roundOverTimer = 0, battleTime = 0;
let battleEntrants = []; // snapshot of participating teams recorded at round start
let teamEliminatedAt = {}; // battleTime when each team lost its last robot
const teamRadio = new Map();
const ordinal = (n) => n + (['th','st','nd','rd'][((n % 100) - 20) % 10] ?? ['th','st','nd','rd'][n % 100] ?? 'th');
const msg = document.getElementById('msg');

function newRound(cfg) {
  cfg = cfg ?? config;
  clearWatched();
  ARENA = cfg.arenaSize ?? 14;
  RADAR_RANGE = ARENA * 2 * Math.SQRT2;
  WALLS = buildWalls(cfg.layout ?? 'cross', ARENA, cfg.wallHp ?? 2);
  wallsVersion++;

  if (cfg.teamsMode) {
    const flat = [];
    for (let t = 0; t < cfg.teamCount; t++) {
      const team = TEAMS[t % TEAMS.length];
      const strats = cfg.teamStrategies[t] || [];
      for (let ri = 0; ri < cfg.robotsPerTeam; ri++)
        flat.push({ team, teamId: t, strategy: strats[ri] || STRATEGY_KEYS[ri % STRATEGY_KEYS.length], robotIndex: ri });
    }
    robots = flat.map(({ team, teamId, strategy, robotIndex }, i) => {
      const a = (i / flat.length) * Math.PI * 2 + Math.PI / 4;
      return {
        name: `${team.name} ${robotIndex + 1}`, color: team.color, teamId, robotIndex,
        label: robotIndex + 1, strategy, mem: {},
        x: Math.sin(a) * ARENA * 0.65, z: Math.cos(a) * ARENA * 0.65,
        heading: a + Math.PI, turret: a + Math.PI,
        seed: i * 1.3, speed: 0, wheel: 0, turnRate: 0, recoil: [0, 0], hit: 0,
        hp: cfg.shotsToKill ?? MAX_HP, maxHp: cfg.shotsToKill ?? MAX_HP, dying: null,
        cooldown: 1.5 + Math.random() * 1.5, nextSide: 0, howCooldown: 0, scan: null, stuckTime: 0, blocked: false,
        wallHit: false, robotHit: false, hitAngle: 0,
      };
    });
  } else {
    const count = cfg.robotCount ?? 4;
    const strats = cfg.strategies ?? [];
    robots = Array.from({ length: count }, (_, i) => {
      const team = TEAMS[i % TEAMS.length];
      const a = (i / count) * Math.PI * 2 + Math.PI / 4;
      return {
        name: team.name, color: team.color, teamId: i, robotIndex: i, label: null,
        strategy: strats[i] || STRATEGY_KEYS[i % STRATEGY_KEYS.length], mem: {},
        x: Math.sin(a) * ARENA * 0.65, z: Math.cos(a) * ARENA * 0.65,
        heading: a + Math.PI, turret: a + Math.PI,
        seed: i * 1.3, speed: 0, wheel: 0, turnRate: 0, recoil: [0, 0], hit: 0,
        hp: cfg.shotsToKill ?? MAX_HP, maxHp: cfg.shotsToKill ?? MAX_HP, dying: null,
        cooldown: 1.5 + Math.random() * 1.5, nextSide: 0, howCooldown: 0, scan: null, stuckTime: 0, blocked: false,
        wallHit: false, robotHit: false, hitAngle: 0,
      };
    });
  }
  bullets = []; explosions = []; impacts = []; crumbles = []; radioPulses = [];
  teamRadio.clear();
  for (const r of robots) r.radioInbox = [];
  for (const r of robots) Object.assign(r, nearestFreePoint(r)); // don't start inside a building
  mines = placeMines(cfg.mineCount ?? 0, cfg.mineDamage ?? 2);
  battleTime = 0;
  teamEliminatedAt = {};
  msg.textContent = '';
  // Snapshot teams for the end-of-battle results screen.
  const seenTeams = new Set();
  battleEntrants = [];
  for (const r of robots) {
    if (!seenTeams.has(r.teamId)) {
      seenTeams.add(r.teamId);
      const teamRobots = robots.filter((x) => x.teamId === r.teamId);
      const displayName = cfg.teamsMode ? TEAMS[r.teamId % TEAMS.length].name : r.name;
      battleEntrants.push({ teamId: r.teamId, name: displayName, color: r.color,
        strategy: r.strategy, startCount: teamRobots.length });
    }
  }
  buildBoard();
}

// Scatter mines on open floor, away from walls, from where the robots start and from each other.
function placeMines(count, damage) {
  const placed = [], lim = ARENA - 1.5;
  for (let tries = 0; placed.length < count && tries < count * 200; tries++) {
    const p = { x: (Math.random() * 2 - 1) * lim, z: (Math.random() * 2 - 1) * lim };
    if (WALLS.some((w) => p.x > w.x0 - 1 && p.x < w.x1 + 1 && p.z > w.z0 - 1 && p.z < w.z1 + 1)) continue;
    if (robots.some((r) => Math.hypot(r.x - p.x, r.z - p.z) < 3.5)) continue;
    if (placed.some((m) => Math.hypot(m.x - p.x, m.z - p.z) < 1.8)) continue;
    placed.push({ ...p, damage: damage || Infinity, seed: Math.random() * 10 });
  }
  return placed;
}

// Knock a hit off a wall block; at zero it crumbles away.
function damageBlock(block, hits = 1) {
  if (block.hp === Infinity || (block.hp -= hits) > 0) return; // Infinity = indestructible
  WALLS.splice(WALLS.indexOf(block), 1);
  wallsVersion++;
  crumbles.push({ ...block, age: 0 });
  playCrumble();
}

function detonate(mine) {
  mines.splice(mines.indexOf(mine), 1);
  explosions.push({ x: mine.x, z: mine.z, age: 0, color: [0.3, 0.32, 0.28], seed: mine.seed });
  playBoom();
  for (const r of robots) {
    if (r.dying !== null || Math.hypot(r.x - mine.x, r.z - mine.z) > MINE_BLAST) continue;
    r.hit = 1;
    r.hp = Math.max(0, r.hp - mine.damage);
    if (r.hp === 0) { r.dying = 0; sendDeathNotice(r); }
  }
  for (const w of WALLS.slice()) {
    const cx = clamp(mine.x, w.x0, w.x1), cz = clamp(mine.z, w.z0, w.z1);
    if (Math.hypot(cx - mine.x, cz - mine.z) < MINE_BLAST) damageBlock(w, mine.damage);
  }
}

// ---------- navigation ----------
// The floor is cut into a grid of small cells; a cell is free when a robot standing on it would
// clear every wall. When a robot's goal is out of sight behind a building, the game finds a
// route over free cells with A* and steers the robot along it, so every strategy can drive round
// obstacles without knowing about them. Rebuilt whenever a wall block is destroyed.
const NAV_CELL = 0.5, NAV_CLEAR = ROBOT_RADIUS + 0.25;
let wallsVersion = 0, nav = null;

function navGrid() {
  if (nav && nav.version === wallsVersion && nav.arena === ARENA) return nav;
  const n = Math.ceil((2 * ARENA) / NAV_CELL), free = new Uint8Array(n * n), lim = ARENA - 0.8;
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      const x = -ARENA + (i + 0.5) * NAV_CELL, z = -ARENA + (j + 0.5) * NAV_CELL;
      free[j * n + i] = Math.abs(x) <= lim && Math.abs(z) <= lim ? 1 : 0;
    }
  const cellIdx = (v) => Math.floor((v + ARENA) / NAV_CELL);
  for (const w of WALLS)
    for (let j = Math.max(0, cellIdx(w.z0 - NAV_CLEAR)); j <= Math.min(n - 1, cellIdx(w.z1 + NAV_CLEAR)); j++)
      for (let i = Math.max(0, cellIdx(w.x0 - NAV_CLEAR)); i <= Math.min(n - 1, cellIdx(w.x1 + NAV_CLEAR)); i++) {
        const x = -ARENA + (i + 0.5) * NAV_CELL, z = -ARENA + (j + 0.5) * NAV_CELL;
        if (Math.hypot(x - clamp(x, w.x0, w.x1), z - clamp(z, w.z0, w.z1)) < NAV_CLEAR) free[j * n + i] = 0;
      }
  return (nav = { n, free, version: wallsVersion, arena: ARENA });
}

const navCell = (g, p) => [clamp(Math.floor((p.x + ARENA) / NAV_CELL), 0, g.n - 1), clamp(Math.floor((p.z + ARENA) / NAV_CELL), 0, g.n - 1)];
const navPoint = (i, j) => ({ x: -ARENA + (i + 0.5) * NAV_CELL, z: -ARENA + (j + 0.5) * NAV_CELL });
const navFree = (g, p) => { const [i, j] = navCell(g, p); return g.free[j * g.n + i] === 1; };

// The free cell closest to p (searching outward ring by ring), as a point.
function nearestFreePoint(p) {
  const g = navGrid(), [ci, cj] = navCell(g, p);
  if (g.free[cj * g.n + ci]) return { x: p.x, z: p.z };
  for (let rad = 1; rad < g.n; rad++) {
    let best = null, bestD = Infinity;
    for (let j = cj - rad; j <= cj + rad; j++)
      for (let i = ci - rad; i <= ci + rad; i++) {
        if (i < 0 || j < 0 || i >= g.n || j >= g.n || Math.max(Math.abs(i - ci), Math.abs(j - cj)) !== rad) continue;
        if (!g.free[j * g.n + i]) continue;
        const q = navPoint(i, j), d = Math.hypot(q.x - p.x, q.z - p.z);
        if (d < bestD) { bestD = d; best = q; }
      }
    if (best) return best;
  }
  return { x: p.x, z: p.z };
}

// True when a robot could drive straight from a to b. The ends are allowed to be a little
// inside the clearance margin, since robots often stand right next to a wall.
function lineClear(a, b) {
  const g = navGrid(), d = Math.hypot(b.x - a.x, b.z - a.z), steps = Math.ceil(d / (NAV_CELL / 2));
  for (let k = 1; k < steps; k++) {
    const t = k / steps, along = t * d;
    if (along < 0.75 || d - along < 0.75) continue;
    if (!navFree(g, { x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t })) return false;
  }
  return true;
}

// A* over free cells, 8-connected without cutting corners. If the goal can't be reached, the
// route leads to the reachable cell nearest to it. Returns a list of points, start excluded.
function findPath(from, to) {
  const g = navGrid(), n = g.n;
  const s = nearestFreePoint(from), t = nearestFreePoint(to);
  const [si, sj] = navCell(g, s), [ti, tj] = navCell(g, t);
  const start = sj * n + si, goal = tj * n + ti;
  const h = (k) => { const dx = Math.abs((k % n) - ti), dz = Math.abs(((k / n) | 0) - tj); return Math.max(dx, dz) + 0.414 * Math.min(dx, dz); };
  const cost = new Float32Array(n * n).fill(Infinity), came = new Int32Array(n * n).fill(-1);
  const heap = [[h(start), start]];
  const push = (e) => { heap.push(e); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  cost[start] = 0;
  let best = start;
  while (heap.length) {
    const [, k] = pop();
    if (k === goal) { best = k; break; }
    if (h(k) < h(best)) best = k;
    const i = k % n, j = (k / n) | 0;
    for (let dj = -1; dj <= 1; dj++)
      for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= n || nj >= n || !g.free[nj * n + ni]) continue;
        if (di && dj && (!g.free[j * n + ni] || !g.free[nj * n + i])) continue;
        const nk = nj * n + ni, c = cost[k] + (di && dj ? 1.414 : 1);
        if (c < cost[nk]) { cost[nk] = c; came[nk] = k; push([c + h(nk), nk]); }
      }
  }
  const path = [];
  for (let k = best; k !== start && k !== -1; k = came[k]) path.push(navPoint(k % n, (k / n) | 0));
  return path.reverse();
}

// Where the robot should actually drive this frame to get to goal: straight at it when the way
// is clear, otherwise to the farthest point of its route that it can see.
function steer(r, goal) {
  if (!goal || lineClear(r, goal)) { r.nav = null; return goal; }
  let nv = r.nav;
  if (!nv || nv.version !== wallsVersion || Math.hypot(nv.gx - goal.x, nv.gz - goal.z) > 1 ||
      battleTime - nv.t > 2 || (r.blocked && battleTime - nv.t > 0.5)) {
    nv = r.nav = { gx: goal.x, gz: goal.z, version: wallsVersion, t: battleTime, path: findPath(r, goal) };
  }
  const p = nv.path;
  while (p.length > 1 && Math.hypot(p[0].x - r.x, p[0].z - r.z) < 0.6) p.shift();
  if (!p.length) return goal;
  for (let i = Math.min(p.length - 1, 24); i > 0; i--) if (lineClear(r, p[i])) return p[i];
  return p[0];
}

const angDiff = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
const turnToward = (cur, target, step) => cur + Math.max(-step, Math.min(step, angDiff(cur, target)));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function fire(r) {
  const side = r.nextSide;
  r.nextSide ^= 1;
  r.recoil[side] = 1;
  r.cooldown = 2 + Math.random() * 1.5;
  const lx = side ? 0.6 : -0.6, lz = 0.6, c = Math.cos(r.turret), s = Math.sin(r.turret);
  const bx = r.x + c * lx + s * lz, bz = r.z - s * lx + c * lz;
  const aimDist = r.scan ? r.scan.range : RADAR_RANGE;
  const ax = r.x + s * aimDist, az = r.z + c * aimDist;
  const ddx = ax - bx, ddz = az - bz, dd = Math.hypot(ddx, ddz);
  bullets.push({
    x: bx, y: 1.4, z: bz, x0: bx, z0: bz,
    vx: (ddx / dd) * BULLET_SPEED, vz: (ddz / dd) * BULLET_SPEED, owner: r, color: r.color, life: 2.5,
  });
}

function fireHowitzer(r, tx, tz) {
  const dx = tx - r.x, dz = tz - r.z;
  const range = Math.hypot(dx, dz);
  if (range < 1) return;
  const sinVal = range * HOWITZER_GRAVITY / (HOWITZER_SPEED * HOWITZER_SPEED);
  if (sinVal > 1) return;
  const theta = Math.PI / 2 - Math.asin(sinVal) / 2;
  const vh = HOWITZER_SPEED * Math.cos(theta);
  const vy0 = HOWITZER_SPEED * Math.sin(theta);
  const vx = (dx / range) * vh, vz = (dz / range) * vh;
  bullets.push({
    x: r.x, z: r.z, y: 1.2, x0: r.x, z0: r.z,
    vx, vz, vy: vy0, gravity: HOWITZER_GRAVITY,
    owner: r, color: r.color, howitzer: true,
    life: 2 * vy0 / HOWITZER_GRAVITY + 0.5,
  });
  r.howCooldown = HOWITZER_COOLDOWN;
}

function landHowitzer(b) {
  if (Math.abs(b.x) > ARENA || Math.abs(b.z) > ARENA) return;
  playBoom();
  explosions.push({ x: b.x, z: b.z, age: 0, color: b.color, seed: Math.random() * 10, scale: 2.0 });
  for (const r of robots) {
    if (r.dying !== null || r.teamId === b.owner.teamId) continue;
    if (Math.hypot(r.x - b.x, r.z - b.z) < HOWITZER_BLAST) {
      r.hit = 1; playMissileHit();
      r.hp -= 1;
      if (r.hp <= 0) { r.hp = 0; r.dying = 0; sendDeathNotice(r); }
    }
  }
  for (const w of WALLS.slice()) {
    const cx = clamp(b.x, w.x0, w.x1), cz = clamp(b.z, w.z0, w.z1);
    if (Math.hypot(cx - b.x, cz - b.z) < HOWITZER_BLAST) damageBlock(w);
  }
}

function drive(r, goal, speedFactor, dt) {
  const before = r.heading;
  let targetSpeed = 0;
  if (goal) {
    const lim = ARENA - 0.8;
    const gx = clamp(goal.x, -lim, lim), gz = clamp(goal.z, -lim, lim);
    const d = Math.hypot(gx - r.x, gz - r.z);
    if (d > 0.3) {
      const want = Math.atan2(gx - r.x, gz - r.z);
      r.heading = turnToward(r.heading, want, 2.4 * dt);
      const off = angDiff(r.heading, want);
      if (Math.abs(off) < 0.8) targetSpeed = MAX_SPEED * clamp(speedFactor, 0, 1.3) * Math.cos(off) * Math.min(1, d / 1.5);
    }
  }
  r.turnRate = angDiff(before, r.heading) / dt;
  r.speed += (targetSpeed - r.speed) * Math.min(1, dt * 4);
  r.x += Math.sin(r.heading) * r.speed * dt;
  r.z += Math.cos(r.heading) * r.speed * dt;
  r.wheel += r.speed * dt;
}

function pushOutOfWall(r, w) {
  const cx = clamp(r.x, w.x0, w.x1), cz = clamp(r.z, w.z0, w.z1);
  const dx = r.x - cx, dz = r.z - cz, d = Math.hypot(dx, dz);
  if (d >= ROBOT_RADIUS) return;
  r.wallHit = true;
  if (!r.robotHit) r.hitAngle = d > 1e-6 ? Math.atan2(cx - r.x, cz - r.z) : r.heading;
  if (d > 1e-6) {
    r.x = cx + (dx / d) * ROBOT_RADIUS;
    r.z = cz + (dz / d) * ROBOT_RADIUS;
  } else {
    const exits = [[w.x0 - ROBOT_RADIUS - r.x, 0], [w.x1 + ROBOT_RADIUS - r.x, 0], [0, w.z0 - ROBOT_RADIUS - r.z], [0, w.z1 + ROBOT_RADIUS - r.z]];
    const [ex, ez] = exits.reduce((a, b) => (Math.hypot(...b) < Math.hypot(...a) ? b : a));
    r.x += ex; r.z += ez;
  }
}

// ---------- radar ----------
function rayBox(ox, oz, dx, dz, w) {
  let t0 = 0, t1 = Infinity;
  for (const [o, d, lo, hi] of [[ox, dx, w.x0, w.x1], [oz, dz, w.z0, w.z1]]) {
    if (Math.abs(d) < 1e-9) {
      if (o < lo || o > hi) return Infinity;
    } else {
      let a = (lo - o) / d, b = (hi - o) / d;
      if (a > b) [a, b] = [b, a];
      t0 = Math.max(t0, a);
      t1 = Math.min(t1, b);
      if (t0 > t1) return Infinity;
    }
  }
  return t0;
}

function rayLength(x, z, angle, max) {
  const dx = Math.sin(angle), dz = Math.cos(angle);
  let t = max;
  if (dx > 1e-9) t = Math.min(t, (ARENA - x) / dx);
  if (dx < -1e-9) t = Math.min(t, (-ARENA - x) / dx);
  if (dz > 1e-9) t = Math.min(t, (ARENA - z) / dz);
  if (dz < -1e-9) t = Math.min(t, (-ARENA - z) / dz);
  for (const w of WALLS) t = Math.min(t, rayBox(x, z, dx, dz, w));
  return t;
}

// Returns { dist, friendly } for the nearest robot in the beam, or null if nothing detected.
function scan(r, angle, width) {
  width = clamp(typeof width === 'number' ? width : 0.17, 0.03, 0.35);
  let found = null;
  for (const o of robots) {
    if (o === r || o.dying !== null) continue;
    const d = Math.hypot(o.x - r.x, o.z - r.z), dir = Math.atan2(o.x - r.x, o.z - r.z);
    if (d > RADAR_RANGE) continue;
    if (Math.abs(angDiff(angle, dir)) > width / 2 + Math.asin(Math.min(1, ROBOT_RADIUS / d))) continue;
    if (rayLength(r.x, r.z, dir, d) < d) continue;
    if (!found || d < found.dist) found = { dist: d, friendly: o.teamId === r.teamId };
  }
  r.scan = { angle, width, found: !!found, range: found ? found.dist : rayLength(r.x, r.z, angle, RADAR_RANGE), age: 0 };
  return found;
}

function deliverRadio() {
  for (const r of robots) {
    const msgs = teamRadio.get(r.teamId) ?? [];
    r.radioInbox = msgs.filter((m) => m._from !== r.robotIndex);
  }
  teamRadio.clear();
}

function sendDeathNotice(r) {
  // Record elimination time if this was the team's last living robot.
  const teamStillAlive = robots.some((x) => x !== r && x.teamId === r.teamId && x.dying === null);
  if (!teamStillAlive) teamEliminatedAt[r.teamId] = battleTime;

  if (!config.radioEnabled) return;
  const allTeamIds = new Set(robots.map((x) => x.teamId));
  for (const teamId of allTeamIds) {
    if (!teamRadio.has(teamId)) teamRadio.set(teamId, []);
    // _from: -1 is a sentinel that no living robot's robotIndex can match, so nobody filters it out.
    teamRadio.get(teamId).push({ type: 'death', teamId: r.teamId, x: r.x, z: r.z, _from: -1 });
  }
}

function think(r) {
  let scanned = false;
  const radio = config.radioEnabled ? {
    inbox: r.radioInbox ?? [],
    send(msg) {
      if (!teamRadio.has(r.teamId)) teamRadio.set(r.teamId, []);
      teamRadio.get(r.teamId).push({ ...msg, _from: r.robotIndex });
      if (battleTime - (r._lastPulse ?? -1) > 0.4) {
        radioPulses.push({ x: r.x, z: r.z, color: r.color, age: 0 });
        r._lastPulse = battleTime;
      }
    },
  } : null;
  const world = {
    arena: ARENA, walls: WALLS, bulletSpeed: BULLET_SPEED, radarRange: RADAR_RANGE, time: battleTime,
    scan: (angle, width) => (scanned ? null : ((scanned = true), scan(r, angle, width))),
    wallDist: (angle) => rayLength(r.x, r.z, angle, RADAR_RANGE),
    radio,
    howitzer: {
      ready: r.howCooldown <= 0,
      maxRange: HOWITZER_SPEED ** 2 / HOWITZER_GRAVITY,
      canReach: (tx, tz) => {
        const d = Math.hypot(tx - r.x, tz - r.z);
        return d >= 1 && d * HOWITZER_GRAVITY <= HOWITZER_SPEED ** 2;
      },
    },
  };
  try {
    return Strategies[r.strategy].think(r, world) || {};
  } catch (err) {
    if (!r.brainError) console.error(`${r.name} (${r.strategy}) crashed:`, (r.brainError = err));
    return {};
  }
}

function livingTeamCount() {
  return new Set(robots.map((r) => r.teamId)).size;
}

function update(dt) {
  if (phase === 'battle') { battleTime += dt; deliverRadio(); }
  for (const r of robots) {
    r.recoil = r.recoil.map((v) => Math.max(0, v - dt * 3));
    r.hit = Math.max(0, r.hit - dt * 4);
    r.cooldown -= dt;
    r.howCooldown = Math.max(0, (r.howCooldown ?? 0) - dt);
    if (r.scan) r.scan.age += dt;
    r.lastX = r.x; r.lastZ = r.z;
    if (r.dying !== null) {
      r.dying += dt / DEATH_TIME;
      r.speed *= Math.max(0, 1 - dt * 6);
      r.turnRate = 0;
      continue;
    }
    const cmd = phase === 'battle' ? think(r) : {};
    drive(r, steer(r, cmd.moveTo), cmd.speed ?? 1, dt);
    if (typeof cmd.aim === 'number') {
      r.turret = turnToward(r.turret, cmd.aim, 3 * dt);
      if (cmd.fire && r.cooldown <= 0 && Math.abs(angDiff(r.turret, cmd.aim)) < 0.08) fire(r);
    }
    if (cmd.fireHowitzer && r.howCooldown <= 0)
      fireHowitzer(r, cmd.fireHowitzer.x, cmd.fireHowitzer.z);
  }

  for (let i = robots.length - 1; i >= 0; i--) {
    const r = robots[i];
    if (r.dying !== null && r.dying >= 1) {
      explosions.push({ x: r.x, z: r.z, age: 0, color: r.color, seed: r.seed });
      robots.splice(i, 1);
    }
  }
  for (const e of explosions) e.age += dt;
  explosions = explosions.filter((e) => e.age < RobotGfx.EXPLOSION_TIME);
  for (const i of impacts) i.age += dt;
  impacts = impacts.filter((i) => i.age < RobotGfx.IMPACT_TIME);
  for (const c of crumbles) c.age += dt;
  crumbles = crumbles.filter((c) => c.age < RobotGfx.CRUMBLE_TIME);
  for (const p of radioPulses) p.age += dt;
  radioPulses = radioPulses.filter((p) => p.age < RobotGfx.RADIO_PULSE_TIME);

  // clear per-frame collision flags before resolving collisions this frame
  for (const r of robots) { r.wallHit = false; r.robotHit = false; }

  for (let i = 0; i < robots.length; i++)
    for (let j = i + 1; j < robots.length; j++) {
      const a = robots[i], b = robots[j];
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d < 1.4 && d > 0) {
        const ang = Math.atan2(dx, dz);
        a.robotHit = true; a.hitAngle = ang;
        b.robotHit = true; b.hitAngle = ang + Math.PI;
        const p = (1.4 - d) / 2 / d;
        a.x -= dx * p; a.z -= dz * p; b.x += dx * p; b.z += dz * p;
      }
    }
  const lim = ARENA - 0.8;
  for (const r of robots) {
    for (const w of WALLS) pushOutOfWall(r, w);
    r.x = clamp(r.x, -lim, lim);
    r.z = clamp(r.z, -lim, lim);
    const moved = Math.hypot(r.x - r.lastX, r.z - r.lastZ), wanted = Math.abs(r.speed) * dt;
    r.stuckTime = wanted > 0.005 && moved < wanted * 0.3 ? r.stuckTime + dt : 0;
    r.blocked = r.stuckTime > 0.5;
  }
  if (phase === 'battle')
    for (const r of robots) {
      if (r.dying !== null) continue;
      const mine = mines.find((m) => Math.hypot(m.x - r.x, m.z - r.z) < MINE_TRIGGER);
      if (mine) detonate(mine);
    }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt;
    let dead = b.life <= 0;
    if (b.howitzer) {
      b.y += b.vy * dt;
      b.vy -= HOWITZER_GRAVITY * dt;
      if (!dead && b.y <= 0 && b.vy < 0) { landHowitzer(b); dead = true; }
    } else {
      const block = WALLS.find((w) => b.x > w.x0 && b.x < w.x1 && b.z > w.z0 && b.z < w.z1);
      if (Math.abs(b.x) > ARENA || Math.abs(b.z) > ARENA || block) {
        impacts.push({ x: b.x, y: b.y, z: b.z, age: 0 });
        dead = true;
      }
      if (block) damageBlock(block);
      for (const r of robots) {
        if (r === b.owner || dead || r.dying !== null) continue;
        if (r.teamId === b.owner.teamId) continue;
        if (Math.hypot(r.x - b.x, r.z - b.z) < 0.7) {
          r.hit = 1;
          playMissileHit();
          r.hp -= 1;
          if (r.hp <= 0) { r.hp = 0; r.dying = 0; sendDeathNotice(r); }
          r.x += b.vx * 0.02; r.z += b.vz * 0.02;
          dead = true;
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }

  if (phase === 'battle' && livingTeamCount() <= 1 && explosions.length === 0) {
    const rep = robots[0];
    endRound(rep ? rep.teamId : null, '');
  } else if (phase === 'battle' && battleTime >= ROUND_TIME) {
    const teamHp = {};
    for (const r of robots.filter((r) => r.dying === null))
      teamHp[r.teamId] = (teamHp[r.teamId] ?? 0) + r.hp;
    const sorted = Object.entries(teamHp).sort((a, b) => b[1] - a[1]);
    const winner = sorted.length > 0 && (sorted.length === 1 || sorted[0][1] > sorted[1][1])
      ? Number(sorted[0][0]) : null;
    endRound(winner, "Time's up! ");
  }
  if (phase === 'over' && (roundOverTimer -= dt) <= 0) {
    document.getElementById('results').hidden = true;
    newRound();
    showSetup();
  }
  updateBoard();
}

function endRound(winnerTeamId, prefix) {
  phase = 'over';
  roundOverTimer = 60; // long fallback; "New Battle" button fires immediately
  showResults(winnerTeamId, prefix);
}

function showResults(winnerTeamId, prefix) {
  // Tally living robots and HP per team.
  const live = {};
  for (const r of robots) {
    if (r.dying === null) {
      live[r.teamId] ??= { count: 0, hp: 0 };
      live[r.teamId].count++;
      live[r.teamId].hp += r.hp;
    }
  }

  // Build sorted result rows: surviving teams by HP desc, then eliminated.
  const rows = battleEntrants.map((e) => ({
    ...e,
    alive: live[e.teamId]?.count ?? 0,
    hp:    live[e.teamId]?.hp    ?? 0,
  }));
  rows.sort((a, b) => {
    if (a.alive > 0 !== b.alive > 0) return (b.alive > 0) - (a.alive > 0); // alive before eliminated
    if (a.alive > 0) return b.hp - a.hp;                                     // alive: more HP = higher place
    return (teamEliminatedAt[b.teamId] ?? 0) - (teamEliminatedAt[a.teamId] ?? 0); // eliminated: later = higher place
  });

  // Title.
  const titleEl = document.getElementById('results-title');
  if (winnerTeamId == null) {
    titleEl.textContent = prefix + 'Draw!';
  } else if (config.teamsMode) {
    titleEl.textContent = prefix + TEAMS[winnerTeamId % TEAMS.length].name + ' team wins!';
  } else {
    const winner = rows.find((e) => e.teamId === winnerTeamId);
    const stratName = winner ? Strategies[winner.strategy]?.name : '';
    titleEl.textContent = prefix + (winner?.name ?? '') + (stratName ? ` the ${stratName}` : '') + ' wins!';
  }

  // Rows.
  const table = document.getElementById('results-table');
  table.innerHTML = '';
  rows.forEach((e, i) => {
    const placeClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const stratSuffix = !config.teamsMode && e.strategy ? ` <small style="font-weight:400;color:#888">${Strategies[e.strategy]?.name ?? ''}</small>` : '';
    const statText = e.alive > 0
      ? `${e.alive} robot${e.alive > 1 ? 's' : ''}, ${e.hp} HP`
      : 'Eliminated';
    const statClass = e.alive > 0 ? '' : 'elim';
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML =
      `<span class="result-place ${placeClass}">${ordinal(i + 1)}</span>` +
      `<span class="dot" style="background:${css(e.color)}"></span>` +
      `<span class="result-name">${e.name}${stratSuffix}</span>` +
      `<span class="result-stat ${statClass}">${statText}</span>`;
    table.append(row);
  });

  document.getElementById('results').hidden = false;
}

function buildSlots() {
  slots.innerHTML = '';
  const count = config.robotCount;
  while (config.strategies.length < count)
    config.strategies.push(STRATEGY_KEYS[config.strategies.length % STRATEGY_KEYS.length]);
  for (let i = 0; i < count; i++) {
    const team = TEAMS[i % TEAMS.length];
    const row = document.createElement('div');
    row.className = 'slot';
    row.innerHTML = `<span class="dot" style="background:${css(team.color)}"></span><b>${team.name}</b><select></select><small></small>`;
    const select = row.querySelector('select'), info = row.querySelector('small');
    for (const key of STRATEGY_KEYS) select.add(new Option(Strategies[key].name, key));
    select.value = config.strategies[i];
    info.textContent = Strategies[config.strategies[i]].description;
    select.addEventListener('change', () => {
      config.strategies[i] = select.value;
      info.textContent = Strategies[select.value].description;
      if (robots[i]) robots[i].strategy = select.value;
      buildBoard();
    });
    slots.append(row);
  }
}

function buildTeamSlots() {
  teamSlots.innerHTML = '';
  while (config.teamStrategies.length < config.teamCount) config.teamStrategies.push([]);
  for (let t = 0; t < config.teamCount; t++) {
    const team = TEAMS[t % TEAMS.length];
    while (config.teamStrategies[t].length < config.robotsPerTeam)
      config.teamStrategies[t].push(STRATEGY_KEYS[config.teamStrategies[t].length % STRATEGY_KEYS.length]);
    const teamRow = document.createElement('div');
    teamRow.className = 'team-row';
    const idDiv = document.createElement('div');
    idDiv.className = 'team-id';
    idDiv.innerHTML = `<span class="dot" style="background:${css(team.color)}"></span><b>${team.name}</b>`;
    teamRow.append(idDiv);
    const selectsDiv = document.createElement('div');
    selectsDiv.className = 'team-selects';
    for (let ri = 0; ri < config.robotsPerTeam; ri++) {
      const select = document.createElement('select');
      for (const key of STRATEGY_KEYS) select.add(new Option(Strategies[key].name, key));
      select.value = config.teamStrategies[t][ri];
      const captT = t, captRi = ri;
      select.addEventListener('change', () => {
        config.teamStrategies[captT][captRi] = select.value;
        const r = robots.find((r) => r.teamId === captT && r.robotIndex === captRi);
        if (r) r.strategy = select.value;
        buildBoard();
      });
      selectsDiv.append(select);
    }
    teamRow.append(selectsDiv);
    teamSlots.append(teamRow);
  }
}

// ---- Bytecode binary packing (12 bytes/instruction: 4-byte uint32 word + 8-byte float64 imm) ----
function bytecodeToBase64(code) {
  const n = code.length / 2;
  const buf = new ArrayBuffer(n * 12);
  const view = new DataView(buf);
  for (let i = 0; i < n; i++) {
    view.setUint32(i * 12,      code[i * 2],     true);
    view.setFloat64(i * 12 + 4, code[i * 2 + 1], true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBytecode(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (bytes.length % 12 !== 0) throw new Error('Corrupt bytecode');
  const view = new DataView(bytes.buffer);
  const n = bytes.length / 12;
  const code = [];
  for (let i = 0; i < n; i++) {
    code.push(view.getUint32(i * 12, true));
    code.push(view.getFloat64(i * 12 + 4, true));
  }
  return code;
}

// Share link — compiles the bot and encodes BYTECODE (not source) in the URL.
// The recipient can fight the bot but cannot see the source.
document.getElementById('rseditor-share').addEventListener('click', () => {
  const errEl  = document.getElementById('rseditor-error');
  const name   = document.getElementById('rseditor-name').value.trim() || 'Bot';
  const source = document.getElementById('rseditor-src').value;
  if (!source.trim()) { errEl.style.color = ''; errEl.textContent = 'Paste your RoboScript source first.'; return; }
  const { bytecode, error } = RoboScriptCompiler.compile(source);
  if (error) { errEl.style.color = ''; errEl.textContent = error; return; }
  const payload = encodeURIComponent(JSON.stringify({ n: name, b: bytecodeToBase64(bytecode) }));
  const url = location.origin + location.pathname + location.search + '#rsbot=' + payload;
  const btn = document.getElementById('rseditor-share');
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Share link'; }, 2000);
  }).catch(() => { prompt('Copy this link:', url); });
});
document.getElementById('rseditor-add').addEventListener('click', () => {
  const nameInput = document.getElementById('rseditor-name');
  const srcInput  = document.getElementById('rseditor-src');
  const errEl     = document.getElementById('rseditor-error');
  errEl.textContent = '';
  try {
    const name   = nameInput.value.trim() || 'Custom';
    const source = srcInput.value;
    if (!source.trim()) { errEl.textContent = 'Paste your RoboScript source first.'; return; }
    const { bytecode, error } = RoboScriptCompiler.compile(source);
    if (error) { errEl.textContent = error; return; }
    // Pick a unique strategy key derived from the name.
    const base = 'rs_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'bot');
    let key = base, n = 2;
    while (key in Strategies) key = base + '_' + n++;
    // Use the first source comment line as the description if present.
    const desc = (source.match(/^--\s*(.+)$/m) || [])[1] ?? 'Custom RoboScript bot';
    RoboScript.register(key, name, desc, bytecode);
    STRATEGY_KEYS.push(key);
    showSetup();
    // Persist to localStorage so the bot survives page reloads.
    try {
      const saved = JSON.parse(localStorage.getItem('robotwar.bots') || '[]');
      if (!saved.some((b) => b.name === name && b.source === source))
        saved.push({ name, source });
      localStorage.setItem('robotwar.bots', JSON.stringify(saved));
    } catch {}
    // Show success then close.
    errEl.style.color = '#2a7';
    errEl.textContent = `"${name}" added — pick it from a robot dropdown.`;
    setTimeout(() => { rseditor.hidden = true; errEl.style.color = ''; errEl.textContent = ''; }, 2000);
  } catch (e) {
    errEl.textContent = e.message;
    console.error('RoboScript editor:', e);
  }
});

document.getElementById('fight').addEventListener('click', () => {
  saveConfig();
  newRound();
  autoCam.target = null;
  autoCam.savedDist = dist;
  for (const c of autoCam.candidates) c.score = 0;
  setup.hidden = true;
  phase = 'battle';
  cancelAnimationFrame(rafId);
  last = performance.now();
  rafId = requestAnimationFrame(frame);
});

let boardRows = [];
let clock = null;
let watchedRobots = [];

function maxViewports() {
  return Math.max(1, Math.floor((window.innerHeight - 24) / (26 + 160 + 8)));
}

function rebuildEyePanel() {
  const panel = document.getElementById('eyepanel');
  panel.innerHTML = '';
  for (const r of watchedRobots) {
    const slot = document.createElement('div');
    slot.className = 'eyeslot';
    slot.innerHTML = `<div class="eyeslot-bar"><span>${r.name}</span><button title="Close">✕</button></div><div class="eyeslot-port"></div>`;
    slot.querySelector('button').addEventListener('click', () => setWatched(r));
    panel.append(slot);
  }
}

function setWatched(r) {
  const idx = watchedRobots.indexOf(r);
  if (idx !== -1) {
    watchedRobots.splice(idx, 1);
  } else {
    if (watchedRobots.length >= maxViewports()) watchedRobots.shift();
    watchedRobots.push(r);
  }
  rebuildEyePanel();
  for (const b of boardRows) b.eye?.classList.toggle('watching', watchedRobots.includes(b.robot));
}

function clearWatched() {
  watchedRobots = [];
  rebuildEyePanel();
  for (const b of boardRows) b.eye?.classList.remove('watching');
}
function buildBoard() {
  board.innerHTML = '';
  clock = document.createElement('div');
  board.append(clock);
  boardRows = [];
  if (config.teamsMode) {
    const groups = {};
    for (const r of robots) (groups[r.teamId] ??= []).push(r);
    for (const [teamId, members] of Object.entries(groups)) {
      const team = TEAMS[teamId % TEAMS.length];
      const hdr = document.createElement('div');
      hdr.className = 'team-header';
      hdr.innerHTML = `<span class="dot" style="background:${css(team.color)}"></span><b>${team.name}</b>`;
      board.append(hdr);
      for (const r of members) {
        const row = document.createElement('div');
        row.innerHTML = `<span class="dot" style="background:${css(r.color)}"></span><span><b>${r.name}</b> · ${Strategies[r.strategy].name}</span><span class="hp"></span><button class="eye" title="Watch this robot">👁</button>`;
        board.append(row);
        const eye = row.querySelector('.eye');
        eye.addEventListener('click', () => setWatched(r));
        boardRows.push({ robot: r, row, hp: row.querySelector('.hp'), eye, shown: null });
      }
    }
  } else {
    for (const r of robots) {
      const row = document.createElement('div');
      row.innerHTML = `<span class="dot" style="background:${css(r.color)}"></span><span><b>${r.name}</b> · ${Strategies[r.strategy].name}</span><span class="hp"></span><button class="eye" title="Watch this robot">👁</button>`;
      board.append(row);
      const eye = row.querySelector('.eye');
      eye.addEventListener('click', () => setWatched(r));
      boardRows.push({ robot: r, row, hp: row.querySelector('.hp'), eye, shown: null });
    }
  }
}

function updateBoard() {
  const left = Math.max(0, Math.ceil(ROUND_TIME - battleTime));
  const clockText = `Time left ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (clock.textContent !== clockText) clock.textContent = clockText;
  for (const b of boardRows) {
    const gone = !robots.includes(b.robot) || b.robot.dying !== null;
    const text = gone ? '♥ 0' : `♥ ${b.robot.hp}`;
    if (text !== b.shown) {
      b.hp.textContent = b.shown = text;
      b.row.classList.toggle('dead', gone);
    }
  }
  const prevLen = watchedRobots.length;
  watchedRobots = watchedRobots.filter((r) => robots.includes(r) && r.dying === null);
  if (watchedRobots.length !== prevLen) {
    rebuildEyePanel();
    for (const b of boardRows) b.eye?.classList.toggle('watching', watchedRobots.includes(b.robot));
  }
}

// ---- Restore saved bots from localStorage ----
function restoreLocalBots() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem('robotwar.bots') || '[]'); } catch { return; }
  for (const { name, source } of saved) {
    try {
      const { bytecode, error } = RoboScriptCompiler.compile(source);
      if (error || !bytecode) continue;
      const base = 'rs_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'bot');
      let key = base, n = 2;
      while (key in Strategies) key = base + '_' + n++;
      const desc = (source.match(/^--\s*(.+)$/m) || [])[1] ?? 'Custom RoboScript bot';
      RoboScript.register(key, name, desc, bytecode);
      STRATEGY_KEYS.push(key);
    } catch {}
  }
}

// ---- Load a bot shared via URL fragment (#rsbot=...) ----
// Bytecode links ({n, b}): auto-register silently — source is never shown.
// Source links ({n, s}): open editor pre-filled (for collaborative sharing).
function checkUrlBot() {
  const m = location.hash.match(/^#rsbot=(.+)/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const data = JSON.parse(decodeURIComponent(m[1]));
    const name = data.n || 'Shared Bot';
    if (data.b) {
      // Bytecode-only link: register directly, no source visible.
      const bytecode = base64ToBytecode(data.b);
      const base = 'rs_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'bot');
      let key = base, n = 2;
      while (key in Strategies) key = base + '_' + n++;
      RoboScript.register(key, name, 'Shared RoboScript bot', bytecode);
      STRATEGY_KEYS.push(key);
      showSetup();
      showToast(`Bot "${name}" added from shared link.`);
    } else if (data.s) {
      // Source link: open editor pre-filled (collaborative / development use).
      document.getElementById('rseditor-name').value = name;
      document.getElementById('rseditor-src').value  = data.s;
      const errEl = document.getElementById('rseditor-error');
      errEl.style.color = '#2a7';
      errEl.textContent = 'Shared bot loaded — review the code then click Add Bot.';
      rseditor.hidden = false;
    }
  } catch (e) {
    showToast('Could not load shared bot: ' + e.message);
  }
}

newRound();
restoreLocalBots();
showSetup();
checkUrlBot();

// ---------- camera ----------
let yaw = 0.5, pitch = 0.85, dist = 40, paused = false;
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  autoCam.holdUntil = performance.now() + 6000;
  yaw -= (e.clientX - drag.x) * 0.008;
  pitch = Math.max(0.3, Math.min(1.45, pitch + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY };
});
// ---------- auto camera ----------
// Walls and buildings hide robots, so during a battle the camera slowly swings round to where
// it can see the most of them, and pans and zooms so the robots still fighting fill the view. A few candidate views are scored each
// frame by tracing lines from the eye to every robot's body and head past the buildings; the
// camera eases toward the best one. Dragging the view takes over for a few seconds.
const autoCam = { holdUntil: 0, next: 0, target: null, candidates: [] };
for (const p of [0.85, 1.05, 1.25])
  for (let k = 0; k < 24; k++) autoCam.candidates.push({ yaw: (k / 24) * Math.PI * 2, pitch: p, score: 0 });

const camCenter = { x: 0, z: 0 };
let camAspect = 1.6;
const camEye = (y, p, d = dist) => [camCenter.x + Math.sin(y) * Math.cos(p) * d, Math.sin(p) * d, camCenter.z + Math.cos(y) * Math.cos(p) * d];
const camTarget = () => [camCenter.x, 0.4, camCenter.z];
const CAM_FOV = (35 * Math.PI) / 180;
// Far enough back to see the whole arena, however big it is.
const maxCamDist = () => Math.max(60, ARENA * 4.2);

// The closest camera distance (for this yaw and pitch) at which every point still lands inside
// the middle of the picture, leaving a margin for the scoreboard and the robots' signs.
function fitDist(points) {
  const proj = mat4.perspective(CAM_FOV, camAspect, 0.5, 500);
  const fits = (d) => {
    const m = mat4.mul(proj, mat4.lookAt(camEye(yaw, pitch, d), camTarget(), [0, 1, 0]));
    return points.every(([x, y, z]) => {
      const cx = m[0] * x + m[4] * y + m[8] * z + m[12], cy = m[1] * x + m[5] * y + m[9] * z + m[13];
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      return w > 0.5 && Math.abs(cx / w) < 0.88 && Math.abs(cy / w) < 0.85;
    });
  };
  let lo = 10, hi = maxCamDist();
  if (fits(lo)) return lo;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
  return hi;
}

// Does the segment from a to b pass through the building block w (as it stands now)?
function segHitsBlock(a, b, w) {
  const f = w.maxHp ? w.hp / w.maxHp : 1, top = (w.h ?? RobotGfx.WALL_HEIGHT) * (0.45 + 0.55 * f);
  let t0 = 0, t1 = 0.97;
  for (const [o, d, lo, hi] of [[a[0], b[0] - a[0], w.x0, w.x1], [a[1], b[1] - a[1], 0, top], [a[2], b[2] - a[2], w.z0, w.z1]]) {
    if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) return false; continue; }
    let u = (lo - o) / d, v = (hi - o) / d;
    if (u > v) [u, v] = [v, u];
    t0 = Math.max(t0, u); t1 = Math.min(t1, v);
    if (t0 > t1) return false;
  }
  return true;
}

function scoreView(c) {
  const eye = camEye(c.yaw, c.pitch);
  let seen = 0;
  for (const r of robots) {
    if (r.dying !== null) continue;
    for (const y of [0.7, 1.6]) {
      const p = [r.x, y, r.z];
      const x0 = Math.min(eye[0], p[0]), x1 = Math.max(eye[0], p[0]), z0 = Math.min(eye[2], p[2]), z1 = Math.max(eye[2], p[2]);
      if (!WALLS.some((w) => w.x1 > x0 && w.x0 < x1 && w.z1 > z0 && w.z0 < z1 && segHitsBlock(eye, p, w))) seen += 0.5;
    }
  }
  return seen;
}

function updateAutoCam(dt) {
  if (phase !== 'battle' || drag || performance.now() < autoCam.holdUntil) return;
  const cs = autoCam.candidates;
  for (let k = 0; k < 8; k++) { const c = cs[autoCam.next]; c.score = scoreView(c); autoCam.next = (autoCam.next + 1) % cs.length; }
  // Prefer low views and little turning; only switch target for a clearly better view.
  const value = (c) => c.score - (c.pitch - 0.85) * 0.8 - Math.abs(angDiff(yaw, c.yaw)) * 0.12;
  const best = cs.reduce((a, b) => (value(b) > value(a) ? b : a));
  if (!autoCam.target || value(best) > value(autoCam.target) + 0.5) autoCam.target = best;
  const t = autoCam.target, ease = Math.min(1, dt * 0.6);
  yaw += clamp(angDiff(yaw, t.yaw) * ease, -0.4 * dt, 0.4 * dt);
  pitch += clamp((t.pitch - pitch) * ease, -0.2 * dt, 0.2 * dt);

  // Pan to the middle of the robots still fighting, then zoom so they all fit.
  const alive = robots.filter((r) => r.dying === null);
  if (!alive.length) return;
  const xs = alive.map((r) => r.x), zs = alive.map((r) => r.z);
  const mx = (Math.min(...xs) + Math.max(...xs)) / 2, mz = (Math.min(...zs) + Math.max(...zs)) / 2;
  const pan = Math.min(1, dt * 0.8);
  camCenter.x += clamp((mx - camCenter.x) * pan, -6 * dt, 6 * dt);
  camCenter.z += clamp((mz - camCenter.z) * pan, -6 * dt, 6 * dt);
  const want = fitDist(alive.flatMap((r) => [[r.x, 0, r.z], [r.x, 2.6, r.z]]));
  dist += clamp((want - dist) * Math.min(1, dt * 0.7), -8 * dt, 8 * dt);
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  autoCam.holdUntil = performance.now() + 6000;
  dist = Math.max(6, Math.min(maxCamDist(), dist * (1 + e.deltaY * 0.001)));
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.target.closest('select, button, input')) return;
  if (e.code === 'Escape' && phase !== 'setup' && confirm('Stop the current battle?')) { paused = false; document.getElementById('results').hidden = true; showSetup(); }
  if (e.code === 'Space') paused = !paused;
  if (e.code === 'KeyM') muted = !muted;
});

// ---------- sound ----------
let audio = null, noise = null, muted = false;
function unlockAudio() {
  if (!audio) {
    audio = new AudioContext();
    noise = audio.createBuffer(1, audio.sampleRate * 1.5, audio.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audio.state === 'suspended') audio.resume();
}
addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);

// A deep thump with a noisy crack on top, for a mine going off.
function playBoom() {
  if (!audio || muted || audio.state !== 'running') return;
  const now = audio.currentTime;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(35, now + 0.5);
  g.gain.setValueAtTime(0.6, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  osc.connect(g).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 0.6);
  playCrumble();
}

// A low, crunchy rumble of filtered noise for a wall block collapsing.
function playCrumble() {
  if (!audio || muted || audio.state !== 'running') return;
  const now = audio.currentTime;
  for (let k = 0; k < 4; k++) {
    const t = now + k * 0.05 + Math.random() * 0.04;
    const src = audio.createBufferSource(), lp = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = noise;
    lp.type = 'lowpass';
    lp.frequency.value = 500 + Math.random() * 500;
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    src.connect(lp).connect(g).connect(audio.destination);
    src.start(t);
  }
}

// A missile hitting a robot: a sharp crack, a low thump that drops in pitch, a rumbling tail
// that darkens as it dies away, and a faint ring from the armour. Built on any audio context
// so it can also be rendered offline.
function missileHitSound(ctx, dest, noiseBuf, t0) {
  const v = 0.85 + Math.random() * 0.3; // a little different every time
  const out = ctx.createGain();
  out.gain.value = 0.3;
  out.connect(dest);
  const noiseThrough = (filters, gain, decay, offset = Math.random()) => {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = noiseBuf;
    let node = src;
    for (const f of filters) node = node.connect(f);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
    node.connect(g).connect(out);
    src.start(t0, offset * 0.3);
    src.stop(t0 + decay + 0.05);
  };
  const filter = (type, freq, q = 0.7) => { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };

  // crack
  noiseThrough([filter('highpass', 1800 * v)], 0.9, 0.07);
  // body and rumble: low-passed noise whose cutoff falls as it fades
  const sweep = filter('lowpass', 2500 * v);
  sweep.frequency.setValueAtTime(2500 * v, t0);
  sweep.frequency.exponentialRampToValueAtTime(180, t0 + 0.6);
  noiseThrough([sweep], 1.0, 0.75);
  // thump
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(95 * v, t0);
  osc.frequency.exponentialRampToValueAtTime(32, t0 + 0.3);
  g.gain.setValueAtTime(0.9, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
  osc.connect(g).connect(out);
  osc.start(t0);
  osc.stop(t0 + 0.45);
  // armour ring, quiet
  for (const [freq, amp, decay] of [[540, 0.07, 0.3], [1370, 0.04, 0.2]]) {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq * v;
    og.gain.setValueAtTime(amp, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
    o.connect(og).connect(out);
    o.start(t0);
    o.stop(t0 + decay);
  }
}

function playMissileHit() {
  if (!audio || muted || audio.state !== 'running') return;
  missileHitSound(audio, audio.destination, noise, audio.currentTime);
}

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

// ---------- main loop ----------
let last = performance.now(), simTime = 0, rafId = 0;
function schedulePreview() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(frame);
}
function frame(now) {
  rafId = 0;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused && phase !== 'setup') { update(dt); simTime += dt; updateAutoCam(dt); }

  resize();
  const dpr = canvas.width / canvas.clientWidth;
  const panelPx = watchedRobots.length > 0 ? Math.round(284 * dpr) : 0;
  const mainW = canvas.width - panelPx;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.8, 0.84, 0.9, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.viewport(0, 0, mainW, canvas.height);

  if (phase === 'setup') { // the preview shows the whole arena, at the zoom from before the battle
    camCenter.x = 0; camCenter.z = 0;
    if (autoCam.savedDist != null) { dist = autoCam.savedDist; autoCam.savedDist = null; }
  }
  camAspect = mainW / canvas.height;
  const eye = camEye(yaw, pitch);
  const view = mat4.lookAt(eye, camTarget(), [0, 1, 0]);
  const proj = mat4.perspective(CAM_FOV, camAspect, 0.5, 500);
  gfx.begin(mat4.mul(proj, view), eye);
  gfx.drawArena(ARENA, GROUND_KINDS[config.ground]);
  gfx.drawWalls(WALLS);
  for (const m of mines) gfx.drawMine(m, simTime);
  for (const p of radioPulses) gfx.drawRadioPulse(p);
  for (const r of robots) gfx.drawRadar(r);
  for (const r of robots) gfx.drawRobot(r, simTime);
  for (const b of bullets) gfx.drawBullet(b);
  for (const i of impacts) gfx.drawImpact(i);
  for (const e of explosions) gfx.drawExplosion(e);
  for (const c of crumbles) gfx.drawCrumble(c);

  if (watchedRobots.length > 0 && phase === 'battle') {
    const sx = canvas.width / canvas.clientWidth, sy = canvas.height / canvas.clientHeight;
    const ports = document.getElementById('eyepanel').querySelectorAll('.eyeslot-port');
    for (let vi = 0; vi < watchedRobots.length; vi++) {
      const r = watchedRobots[vi];
      const port = ports[vi];
      if (!port) continue;
      const rect = port.getBoundingClientRect();
      const pw = Math.round(rect.width * sx), ph = Math.round(rect.height * sy);
      const px = Math.round(rect.left * sx);
      const py = Math.round(canvas.height - rect.bottom * sy);
      if (pw <= 0 || ph <= 0 || py < 0 || px < 0 || px + pw > canvas.width || py + ph > canvas.height) continue;
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(px, py, pw, ph);
      gl.viewport(px, py, pw, ph);
      gl.clearColor(0.12, 0.15, 0.22, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const eyePos = [r.x, 1.6, r.z];
      const lookPt = [r.x + Math.sin(r.turret) * 10, 1.6, r.z + Math.cos(r.turret) * 10];
      const eyeView = mat4.lookAt(eyePos, lookPt, [0, 1, 0]);
      const eyeProj = mat4.perspective((65 * Math.PI) / 180, pw / ph, 0.3, 200);
      gfx.begin(mat4.mul(eyeProj, eyeView), eyePos);
      gfx.drawArena(ARENA, GROUND_KINDS[config.ground]);
      gfx.drawWalls(WALLS);
      for (const m of mines) gfx.drawMine(m, simTime);
      for (const p of radioPulses) gfx.drawRadioPulse(p);
      for (const rb of robots) if (rb !== r) gfx.drawRobot(rb, simTime);
      for (const b of bullets) gfx.drawBullet(b);
      for (const i of impacts) gfx.drawImpact(i);
      for (const e of explosions) gfx.drawExplosion(e);
      for (const c of crumbles) gfx.drawCrumble(c);
      gl.disable(gl.SCISSOR_TEST);
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  if (phase !== 'setup') rafId = requestAnimationFrame(frame);
}
schedulePreview(); // initial arena preview
</script>
</body>
</html>
