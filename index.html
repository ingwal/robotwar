<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot War</title>
<link rel="icon" href="favicon.ico">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cdd6e4; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #hud { position: fixed; left: 12px; top: 10px; padding: 6px 10px; border-radius: 8px;
         background: rgba(255, 255, 255, 0.65); color: #2a3347; font-size: 13px; user-select: none; }
  #msg { position: fixed; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none;
         color: #2a3347; font-size: 48px; font-weight: 800; text-shadow: 0 2px 0 #fff; }
  .panel { background: rgba(255, 255, 255, 0.92); color: #2a3347; border-radius: 14px;
           box-shadow: 0 8px 30px rgba(30, 40, 70, 0.25); }
  #setup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px;
           max-height: calc(100vh - 40px); overflow-y: auto; }
  #setup[hidden] { display: none; }
  #setup h2 { margin: 0 0 14px; font-size: 20px; }
  .config-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e0e5ef; }
  .config-row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .config-row label { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .config-row input[type=range] { accent-color: #2a3347; width: 110px; }
  .config-row select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid #b8c2d4; background: #fff; }
  .mode-row { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
  .count-row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .count-row label { display: flex; align-items: center; gap: 8px; }
  .count-row input[type=number] { width: 50px; font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid #b8c2d4; }
  .team-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .team-id { display: flex; align-items: center; gap: 8px; min-width: 72px; padding-top: 7px;
             font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.65; flex-shrink: 0; }
  .team-selects { display: flex; gap: 10px; align-items: center; }
  .slot { display: grid; grid-template-columns: 18px 70px 1fr; gap: 4px 10px; align-items: center; margin-bottom: 12px; }
  .slot small { grid-column: 3; color: #5a6478; font-size: 12px; line-height: 1.35; }
  .slot select, .team-selects select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid #b8c2d4; background: #fff; }
  .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 1px solid #b8c2d4;
           background: #fff; color: #2a3347; cursor: pointer; }
  button.primary { background: #2a3347; border-color: #2a3347; color: #fff; }
  #board { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; font-size: 13px; user-select: none; }
  #board div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #board .dead { opacity: 0.4; text-decoration: line-through; }
  #board .hp { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  #board .team-header { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-top: 5px; }
  #board .eye { all: unset; cursor: pointer; font-size: 14px; opacity: 0.3; margin-left: 4px; line-height: 1; }
  #board .eye:hover, #board .eye.watching { opacity: 1; }
  #eyepanel { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 260px;
              pointer-events: none; z-index: 10; display: flex; flex-direction: column; gap: 8px;
              overflow: hidden; }
  .eyeslot-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                 background: rgba(255,255,255,0.9); color: #2a3347; border-radius: 8px 8px 0 0;
                 padding: 4px 10px; font-size: 12px; font-weight: 600; pointer-events: auto; }
  .eyeslot-bar button { all: unset; cursor: pointer; font-size: 13px; opacity: 0.5; }
  .eyeslot-bar button:hover { opacity: 1; }
  .eyeslot-port { height: 160px; border-radius: 0 0 8px 8px; flex-shrink: 0;
                  box-shadow: 0 6px 24px rgba(0,0,0,0.4), inset 0 0 0 1.5px rgba(255,255,255,0.2); }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
             width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px; z-index: 20; }
  #results[hidden] { display: none; }
  #results h2 { margin: 0 0 16px; font-size: 20px; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 0;
                border-bottom: 1px solid #e0e5ef; }
  .result-row:last-child { border-bottom: none; }
  .result-place { font-size: 13px; font-weight: 700; width: 28px; text-align: right;
                  color: #888; flex-shrink: 0; }
  .result-place.gold   { color: #b8860b; }
  .result-place.silver { color: #888; }
  .result-place.bronze { color: #a0522d; }
  .result-name { flex: 1; font-weight: 600; font-size: 14px; }
  .result-stat { font-size: 13px; color: #5a6478; white-space: nowrap; }
  .result-stat.elim { color: #c04040; }
  #rseditor { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
              width: min(580px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 22px; z-index: 30; }
  #rseditor[hidden] { display: none; }
  #rseditor h2 { margin: 0 0 14px; font-size: 20px; }
  #rseditor-name { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
                   padding: 5px 8px; border-radius: 6px; border: 1px solid #b8c2d4; margin-bottom: 10px; }
  #rseditor-src { width: 100%; box-sizing: border-box; height: 280px;
                  font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.5;
                  padding: 8px; border-radius: 6px; border: 1px solid #b8c2d4; resize: vertical; }
  #rseditor-error { color: #c04040; font-size: 12px; margin-top: 6px; min-height: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Robot War</b> · drag to orbit · scroll to zoom · space to pause · Esc to stop · M to mute · click once to enable sound</div>
<div id="msg"></div>
<div id="board" class="panel"></div>
<div id="eyepanel"></div>
<div id="results" class="panel" hidden>
  <h2 id="results-title">Battle Results</h2>
  <div id="results-table"></div>
  <div class="buttons"><button id="results-ok" class="primary">New Battle</button></div>
</div>
<div id="rstoast" hidden style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
     background:#1e2d45;color:#fff;padding:10px 20px;border-radius:10px;
     font-size:14px;z-index:50;pointer-events:none;white-space:nowrap"></div>
<div id="rseditor" class="panel" hidden>
  <h2>RoboScript Bot <a href="roboscript-reference.html" target="_blank" style="font-size:13px;font-weight:400;margin-left:10px;vertical-align:middle">Language reference ↗</a></h2>
  <input id="rseditor-name" type="text" placeholder="Bot name">
  <textarea id="rseditor-src" spellcheck="false" autocorrect="off" autocapitalize="off"
            placeholder="-- write your RoboScript here&#10;-- click Language reference ↗ above for docs and examples"></textarea>
  <div id="rseditor-error"></div>
  <div class="buttons">
    <button id="rseditor-share" style="margin-right:auto">Share link</button>
    <button id="rseditor-cancel">Cancel</button>
    <button id="rseditor-add" class="primary">Add Bot</button>
  </div>
</div>
<div id="setup" class="panel">
  <h2>Robot War</h2>
  <div class="config-section">
    <div class="config-row">
      <label>Arena: <span id="arenaVal">14</span>
        <input type="range" id="arenaSize" min="10" max="150" value="14" step="1">
      </label>
      <label>Shots to kill: <input type="number" id="shotsToKill" min="1" max="10" value="6"></label>
      <label>Time limit: <input type="number" id="roundMinutes" min="1" max="30" value="3"> min</label>
      <label>Land mines: <input type="number" id="mineCount" min="0" max="30" value="0"></label>
      <label>Mine strength:
        <select id="mineDamage">
          <option value="1">Weak (1 hit)</option>
          <option value="2" selected>Normal (2 hits)</option>
          <option value="4">Strong (4 hits)</option>
          <option value="0">Deadly</option>
        </select>
      </label>
      <label>Obstacles:
        <select id="layoutPick">
          <option value="open">Open</option>
          <option value="cross" selected>Cross</option>
          <option value="fourRooms">Four Rooms</option>
          <option value="pillars">Pillars</option>
          <option value="maze">Maze</option>
          <option value="downtown">Downtown</option>
        </select>
      </label>
      <label>Ground:
        <select id="groundPick">
          <option value="checker" selected>Checkerboard</option>
          <option value="grass">Grass</option>
          <option value="asphalt">Asphalt</option>
          <option value="concrete">Concrete</option>
        </select>
      </label>
      <label>Wall strength:
        <select id="wallHp">
          <option value="1">Flimsy (1 hit)</option>
          <option value="2" selected>Normal (2 hits)</option>
          <option value="4">Sturdy (4 hits)</option>
          <option value="8">Tough (8 hits)</option>
          <option value="0">Indestructible</option>
        </select>
      </label>
    </div>
  </div>
  <div class="mode-row">
    <label><input type="checkbox" id="teamsMode"> Teams mode</label>
    <label><input type="checkbox" id="radioEnabled" checked> Radio</label>
    <label><input type="checkbox" id="soundEnabled" checked> Sound</label>
  </div>
  <div id="noTeamsSection">
    <div class="count-row">
      <label>Robots: <input type="number" id="robotCount" min="1" max="8" value="4"></label>
    </div>
    <div id="slots"></div>
  </div>
  <div id="teamsSection" hidden>
    <div class="count-row">
      <label>Teams: <input type="number" id="teamCount" min="2" max="4" value="2"></label>
      <label>Robots per team: <input type="number" id="robotsPerTeam" min="1" max="4" value="2"></label>
    </div>
    <div id="teamSlots"></div>
  </div>
  <div class="buttons">
    <button id="rseditor-open" style="margin-right:auto">RoboScript…</button>
    <button id="shuffle">Shuffle</button>
    <button id="fight" class="primary">Fight!</button>
  </div>
</div>
<script src="robot.js?v=2"></script>
<script src="strategies.js?v=2"></script>
<script src="roboscript.js?v=2"></script>
<script src="roboscript-compiler.js?v=2"></script>
<script src="game.js?v=1"></script>
<script>
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true });
if (!gl) throw new Error('WebGL2 not supported');
const gfx = RobotGfx.create(gl);
const { mat4 } = RobotGfx;

const WALL_HP_CHOICES = [1, 2, 4, 8, 0];
const MINE_DAMAGE_CHOICES = [1, 2, 4, 0];

const GROUND_KINDS = {
  checker: null,
  grass:    { tex: 'ground-grass.jpg',    tile: 4 },
  asphalt:  { tex: 'ground-asphalt.jpg',  tile: 4 },
  concrete: { tex: 'ground-concrete.jpg', tile: 4 },
};

const TEXTURE_FILES = GameEngine.BUILDING_KINDS.map((k) => k.tex);
for (const g of Object.values(GROUND_KINDS)) if (g) g.layer = TEXTURE_FILES.push(g.tex) - 1;
gfx.loadTextures(TEXTURE_FILES.map((f) => 'textures/' + f));

const STRATEGY_KEYS = Object.keys(Strategies);

let config = {
  arenaSize: 14, layout: 'cross', shotsToKill: 6, wallHp: 2, mineCount: 0, mineDamage: 2, ground: 'checker',
  roundMinutes: 3,
  teamsMode: false, radioEnabled: true, soundEnabled: true,
  robotCount: 4,
  strategies: ['rambo', 'pacer', 'sniper', 'hunter'],
  teamCount: 2, robotsPerTeam: 2,
  teamStrategies: [['rambo', 'pacer'], ['sniper', 'hunter']],
};
// Copy over whatever is valid in saved (from this browser's storage or from the address);
// anything missing or out of range keeps its current value.
function applySaved(saved) {
  if (!saved || typeof saved !== 'object') return;
  const isStrategy = (k) => typeof k === 'string' && Object.hasOwn(Strategies, k);
  if (saved.arenaSize >= 10 && saved.arenaSize <= GameEngine.MAX_ARENA) config.arenaSize = saved.arenaSize | 0;
  if (Object.hasOwn(GameEngine.WALL_LAYOUTS, saved.layout) || saved.layout === 'downtown') config.layout = saved.layout;
  if (saved.shotsToKill >= 1 && saved.shotsToKill <= 10) config.shotsToKill = saved.shotsToKill | 0;
  if (WALL_HP_CHOICES.includes(saved.wallHp)) config.wallHp = saved.wallHp;
  if (saved.mineCount >= 0 && saved.mineCount <= 30) config.mineCount = saved.mineCount | 0;
  if (MINE_DAMAGE_CHOICES.includes(saved.mineDamage)) config.mineDamage = saved.mineDamage;
  if (saved.roundMinutes >= 1 && saved.roundMinutes <= 30) config.roundMinutes = saved.roundMinutes | 0;
  if (Object.hasOwn(GROUND_KINDS, saved.ground)) config.ground = saved.ground;
  if (typeof saved.teamsMode === 'boolean') config.teamsMode = saved.teamsMode;
  if (typeof saved.radioEnabled === 'boolean') config.radioEnabled = saved.radioEnabled;
  if (typeof saved.soundEnabled === 'boolean') config.soundEnabled = saved.soundEnabled;
  if (saved.robotCount >= 1 && saved.robotCount <= 8) config.robotCount = saved.robotCount | 0;
  if (Array.isArray(saved.strategies))
    config.strategies = saved.strategies.slice(0, 8).map((k) => (isStrategy(k) ? k : STRATEGY_KEYS[0]));
  if (saved.teamCount >= 2 && saved.teamCount <= 4) config.teamCount = saved.teamCount | 0;
  if (saved.robotsPerTeam >= 1 && saved.robotsPerTeam <= 4) config.robotsPerTeam = saved.robotsPerTeam | 0;
  if (Array.isArray(saved.teamStrategies))
    config.teamStrategies = saved.teamStrategies.slice(0, 4).map((arr) =>
      Array.isArray(arr) ? arr.slice(0, 4).map((k) => (isStrategy(k) ? k : STRATEGY_KEYS[0])) : []
    );
}

// ---------- settings in the address ----------
// The setup is mirrored in the page's address, so a battle can be bookmarked or shared:
//   ?arena=14&layout=downtown&ground=grass&shots=6&walls=2&mines=5&blast=2&robots=rambo,norden,sniper
//   ?...&mode=teams&teams=rambo,pacer.sniper,hunter        (one team after another, split by ".")
// walls=0 is indestructible, blast=0 deadly, radio=0 turns team radio off. An address with settings wins over what this
// browser remembered.
function configToQuery(c) {
  const p = [['arena', c.arenaSize], ['layout', c.layout], ['ground', c.ground], ['shots', c.shotsToKill],
    ['walls', c.wallHp], ['mines', c.mineCount], ['blast', c.mineDamage], ['radio', c.radioEnabled ? 1 : 0],
    ['minutes', c.roundMinutes]];
  if (c.teamsMode)
    p.push(['mode', 'teams'], ['teams', c.teamStrategies.slice(0, c.teamCount).map((t) => t.slice(0, c.robotsPerTeam).join(',')).join('.')]);
  else p.push(['robots', c.strategies.slice(0, c.robotCount).join(',')]);
  return p.map(([k, v]) => k + '=' + encodeURIComponent(v).replace(/%2C/g, ',')).join('&');
}

function configFromQuery(search) {
  const q = new URLSearchParams(search), c = {};
  const num = (k) => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : undefined);
  c.arenaSize = num('arena'); c.shotsToKill = num('shots'); c.wallHp = num('walls');
  c.mineCount = num('mines'); c.mineDamage = num('blast'); c.roundMinutes = num('minutes');
  c.layout = q.get('layout') ?? undefined; c.ground = q.get('ground') ?? undefined;
  if (q.has('mode')) c.teamsMode = q.get('mode') === 'teams';
  if (q.has('radio')) c.radioEnabled = q.get('radio') !== '0';
  if (q.get('robots')) { c.strategies = q.get('robots').split(','); c.robotCount = c.strategies.length; }
  if (q.get('teams')) {
    c.teamStrategies = q.get('teams').split('.').map((t) => t.split(','));
    c.teamCount = c.teamStrategies.length;
    c.robotsPerTeam = Math.max(...c.teamStrategies.map((t) => t.length));
  }
  return c;
}

try { applySaved(JSON.parse(localStorage.getItem('robotwar.config'))); } catch {}
applySaved(configFromQuery(location.search));

let phase = 'setup';
let game;
let explosions = [], impacts = [], crumbles = [], radioPulses = [];
let roundOverPending = false, roundOverWinner = null, roundOverPrefix = '';
let roundOverTimer = 0;
const ordinal = (n) => n + (['th','st','nd','rd'][((n % 100) - 20) % 10] ?? ['th','st','nd','rd'][n % 100] ?? 'th');
const msg = document.getElementById('msg');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const angDiff = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));

function newRound(cfg) {
  clearWatched();
  game = GameEngine.create(cfg ?? config, Strategies);
  muted = !(cfg ?? config).soundEnabled;
  msg.textContent = '';
  buildBoard();
}

function update(dt) {
  const events = game.tick(dt);
  for (const e of events) {
    if (e.type === 'boom')             { explosions.push({ x: e.x, z: e.z, age: 0, color: e.color, seed: e.seed, scale: e.scale }); playBoom(); }
    else if (e.type === 'crumble')     { crumbles.push({ x0: e.x0, z0: e.z0, x1: e.x1, z1: e.z1, h: e.h, color: e.color, maxHp: e.maxHp, seed: e.seed, age: 0 }); playCrumble(); }
    else if (e.type === 'impact')      { impacts.push({ x: e.x, y: e.y, z: e.z, age: 0 }); }
    else if (e.type === 'radio-pulse') { radioPulses.push({ x: e.x, z: e.z, color: e.color, age: 0 }); }
    else if (e.type === 'robot-exploded') { explosions.push({ x: e.x, z: e.z, age: 0, color: e.color, seed: e.seed }); }
    else if (e.type === 'missile-hit') playMissileHit();
    else if (e.type === 'round-over')  { roundOverPending = true; roundOverWinner = e.winner; roundOverPrefix = e.prefix; }
  }
  for (const e of explosions) e.age += dt;
  explosions = explosions.filter((e) => e.age < RobotGfx.EXPLOSION_TIME);
  for (const i of impacts) i.age += dt;
  impacts = impacts.filter((i) => i.age < RobotGfx.IMPACT_TIME);
  for (const c of crumbles) c.age += dt;
  crumbles = crumbles.filter((c) => c.age < RobotGfx.CRUMBLE_TIME);
  for (const p of radioPulses) p.age += dt;
  radioPulses = radioPulses.filter((p) => p.age < RobotGfx.RADIO_PULSE_TIME);
  if (roundOverPending && explosions.length === 0) {
    roundOverPending = false;
    roundOverTimer = 60;
    showResults(roundOverWinner, roundOverPrefix);
  }
  if (roundOverTimer > 0) {
    roundOverTimer -= dt;
    if (roundOverTimer <= 0) {
      document.getElementById('results').hidden = true;
      newRound();
      showSetup();
      return;
    }
  }
  updateBoard();
}

function showResults(winnerTeamId, prefix) {
  const live = {};
  for (const r of game.robots) {
    if (r.dying === null) {
      live[r.teamId] ??= { count: 0, hp: 0 };
      live[r.teamId].count++;
      live[r.teamId].hp += r.hp;
    }
  }

  const rows = game.battleEntrants.map((e) => ({
    ...e,
    alive: live[e.teamId]?.count ?? 0,
    hp:    live[e.teamId]?.hp    ?? 0,
  }));
  rows.sort((a, b) => {
    if (a.alive > 0 !== b.alive > 0) return (b.alive > 0) - (a.alive > 0);
    if (a.alive > 0) return b.hp - a.hp;
    return (game.teamEliminatedAt[b.teamId] ?? 0) - (game.teamEliminatedAt[a.teamId] ?? 0);
  });

  const titleEl = document.getElementById('results-title');
  if (winnerTeamId == null) {
    titleEl.textContent = prefix + 'Draw!';
  } else if (config.teamsMode) {
    titleEl.textContent = prefix + GameEngine.TEAMS[winnerTeamId % GameEngine.TEAMS.length].name + ' team wins!';
  } else {
    const winner = rows.find((e) => e.teamId === winnerTeamId);
    const stratName = winner ? Strategies[winner.strategy]?.name : '';
    titleEl.textContent = prefix + (winner?.name ?? '') + (stratName ? ` the ${stratName}` : '') + ' wins!';
  }

  // Rows.
  const table = document.getElementById('results-table');
  table.innerHTML = '';
  rows.forEach((e, i) => {
    const placeClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const stratSuffix = !config.teamsMode && e.strategy ? ` <small style="font-weight:400;color:#888">${Strategies[e.strategy]?.name ?? ''}</small>` : '';
    const statText = e.alive > 0
      ? `${e.alive} robot${e.alive > 1 ? 's' : ''}, ${e.hp} HP`
      : 'Eliminated';
    const statClass = e.alive > 0 ? '' : 'elim';
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML =
      `<span class="result-place ${placeClass}">${ordinal(i + 1)}</span>` +
      `<span class="dot" style="background:${css(e.color)}"></span>` +
      `<span class="result-name">${e.name}${stratSuffix}</span>` +
      `<span class="result-stat ${statClass}">${statText}</span>`;
    table.append(row);
  });

  document.getElementById('results').hidden = false;
}

// ---------- setup screen and scoreboard ----------
const setup = document.getElementById('setup');
const slots = document.getElementById('slots');
const teamSlots = document.getElementById('teamSlots');
const board = document.getElementById('board');
const css = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(',')})`;

function buildSlots() {
  slots.innerHTML = '';
  const count = config.robotCount;
  while (config.strategies.length < count)
    config.strategies.push(STRATEGY_KEYS[config.strategies.length % STRATEGY_KEYS.length]);
  for (let i = 0; i < count; i++) {
    const team = GameEngine.TEAMS[i % GameEngine.TEAMS.length];
    const row = document.createElement('div');
    row.className = 'slot';

function buildTeamSlots() {
  teamSlots.innerHTML = '';
  while (config.teamStrategies.length < config.teamCount) config.teamStrategies.push([]);
  for (let t = 0; t < config.teamCount; t++) {

    while (config.teamStrategies[t].length < config.robotsPerTeam)

      select.value = config.teamStrategies[t][ri];

      select.addEventListener('change', () => {

// ---- Bytecode binary packing (12 bytes/instruction: 4-byte uint32 word + 8-byte float64 imm) ----
function bytecodeToBase64(code) {
  const n = code.length / 2;
  const buf = new ArrayBuffer(n * 12);
  const view = new DataView(buf);
  for (let i = 0; i < n; i++) {
    view.setUint32(i * 12,      code[i * 2],     true);
    view.setFloat64(i * 12 + 4, code[i * 2 + 1], true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBytecode(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (bytes.length % 12 !== 0) throw new Error('Corrupt bytecode');
  const view = new DataView(bytes.buffer);
  const n = bytes.length / 12;
  const code = [];
  for (let i = 0; i < n; i++) {
    code.push(view.getUint32(i * 12, true));
    code.push(view.getFloat64(i * 12 + 4, true));
  }
  return code;
}

  if (!source.trim()) { errEl.style.color = ''; errEl.textContent = 'Paste your RoboScript source first.'; return; }
  const { bytecode, error } = RoboScriptCompiler.compile(source);
  if (error) { errEl.style.color = ''; errEl.textContent = error; return; }
  const payload = encodeURIComponent(JSON.stringify({ n: name, b: bytecodeToBase64(bytecode) }));
  const url = location.origin + location.pathname + location.search + '#rsbot=' + payload;
  const btn = document.getElementById('rseditor-share');
  navigator.clipboard.writeText(url).then(() => {

document.getElementById('rseditor-add').addEventListener('click', () => {
  const nameInput = document.getElementById('rseditor-name');
  const srcInput  = document.getElementById('rseditor-src');
  const errEl     = document.getElementById('rseditor-error');
  errEl.textContent = '';
  try {
    const name   = nameInput.value.trim() || 'Custom';
    const source = srcInput.value;
    if (!source.trim()) { errEl.textContent = 'Paste your RoboScript source first.'; return; }
    const { bytecode, error } = RoboScriptCompiler.compile(source);
    if (error) { errEl.textContent = error; return; }
    // If a bot with this name already exists, update it in place; otherwise create a new one.
    const existingKey = STRATEGY_KEYS.find((k) => k.startsWith('rs_') && Strategies[k]?.name === name);
    let key = existingKey;
    if (!key) {
      const base = 'rs_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'bot');
      key = base; let n = 2;
      while (key in Strategies) key = base + '_' + n++;
    }
    // Use the first source comment line as the description if present.
    const desc = (source.match(/^--\s*(.+)$/m) || [])[1] ?? 'Custom RoboScript bot';
    RoboScript.register(key, name, desc, bytecode);
    if (!existingKey) STRATEGY_KEYS.push(key);

    try {
      const saved = JSON.parse(localStorage.getItem('robotwar.bots') || '[]');

    } catch {}
    // Show success then close.
    errEl.style.color = '#2a7';
    errEl.textContent = `"${name}" added — pick it from a robot dropdown.`;
    setTimeout(() => { rseditor.hidden = true; errEl.style.color = ''; errEl.textContent = ''; }, 2000);

function maxViewports() {

function rebuildEyePanel() {

function setWatched(r) {

  if (idx !== -1) {
    watchedRobots.splice(idx, 1);

    if (watchedRobots.length >= maxViewports()) watchedRobots.shift();
    watchedRobots.push(r);

  rebuildEyePanel();
  for (const b of boardRows) b.eye?.classList.toggle('watching', watchedRobots.includes(b.robot));

        board.append(row);

      board.append(row);

function updateBoard() {
  const left = Math.max(0, Math.ceil(config.roundMinutes * 60 - game.battleTime));
  const clockText = `Time left ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (clock.textContent !== clockText) clock.textContent = clockText;
  for (const b of boardRows) {
    const gone = !game.robots.includes(b.robot) || b.robot.dying !== null;
    const text = gone ? '♥ 0' : `♥ ${b.robot.hp}`;
    if (text !== b.shown) {
      b.hp.textContent = b.shown = text;
      b.row.classList.toggle('dead', gone);
    }
  }
  const prevLen = watchedRobots.length;
  watchedRobots = watchedRobots.filter((r) => game.robots.includes(r) && r.dying === null);
  if (watchedRobots.length !== prevLen) {
    rebuildEyePanel();
    for (const b of boardRows) b.eye?.classList.toggle('watching', watchedRobots.includes(b.robot));
  }
}

// ---- Load a bot shared via URL fragment (#rsbot=...) ----
// Bytecode links ({n, b}): auto-register silently — source is never shown.
// Source links ({n, s}): open editor pre-filled (for collaborative sharing).
function checkUrlBot() {
  const m = location.hash.match(/^#rsbot=(.+)/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const data = JSON.parse(decodeURIComponent(m[1]));
    const name = data.n || 'Shared Bot';
    if (data.b) {
      // Bytecode-only link: register directly, no source visible.
      const bytecode = base64ToBytecode(data.b);
      const base = 'rs_' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'bot');
      let key = base, n = 2;
      while (key in Strategies) key = base + '_' + n++;
      RoboScript.register(key, name, 'Shared RoboScript bot', bytecode);
      STRATEGY_KEYS.push(key);
      showSetup();
      showToast(`Bot "${name}" added from shared link.`);
    } else if (data.s) {
      // Source link: open editor pre-filled (collaborative / development use).
      document.getElementById('rseditor-name').value = name;
      document.getElementById('rseditor-src').value  = data.s;
      const errEl = document.getElementById('rseditor-error');
      errEl.style.color = '#2a7';
      errEl.textContent = 'Shared bot loaded — review the code then click Add Bot.';
      rseditor.hidden = false;
    }
  } catch (e) {
    showToast('Could not load shared bot: ' + e.message);
  }
}

// ---------- camera ----------
let yaw = 0.5, pitch = 0.85, dist = 40, paused = false;
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  autoCam.holdUntil = performance.now() + 6000;
  yaw -= (e.clientX - drag.x) * 0.008;
  pitch = Math.max(0.3, Math.min(1.45, pitch + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY };
});
// ---------- auto camera ----------
// Walls and buildings hide robots, so during a battle the camera slowly swings round to where
// it can see the most of them, and pans and zooms so the robots still fighting fill the view. A few candidate views are scored each
// frame by tracing lines from the eye to every robot's body and head past the buildings; the
// camera eases toward the best one. Dragging the view takes over for a few seconds.
const autoCam = { holdUntil: 0, next: 0, target: null, candidates: [] };
for (const p of [0.85, 1.05, 1.25])
  for (let k = 0; k < 24; k++) autoCam.candidates.push({ yaw: (k / 24) * Math.PI * 2, pitch: p, score: 0 });

const camCenter = { x: 0, z: 0 };
let camAspect = 1.6;
const camEye = (y, p, d = dist) => [camCenter.x + Math.sin(y) * Math.cos(p) * d, Math.sin(p) * d, camCenter.z + Math.cos(y) * Math.cos(p) * d];
const camTarget = () => [camCenter.x, 0.4, camCenter.z];
const CAM_FOV = (35 * Math.PI) / 180;
const maxCamDist = () => Math.max(60, game.arena * 4.2);

// The closest camera distance (for this yaw and pitch) at which every point still lands inside
// the middle of the picture, leaving a margin for the scoreboard and the robots' signs.
function fitDist(points) {
  const proj = mat4.perspective(CAM_FOV, camAspect, 0.5, 500);
  const fits = (d) => {
    const m = mat4.mul(proj, mat4.lookAt(camEye(yaw, pitch, d), camTarget(), [0, 1, 0]));
    return points.every(([x, y, z]) => {
      const cx = m[0] * x + m[4] * y + m[8] * z + m[12], cy = m[1] * x + m[5] * y + m[9] * z + m[13];
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      return w > 0.5 && Math.abs(cx / w) < 0.88 && Math.abs(cy / w) < 0.85;
    });
  };
  let lo = 10, hi = maxCamDist();
  if (fits(lo)) return lo;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
  return hi;
}

// Does the segment from a to b pass through the building block w (as it stands now)?
function segHitsBlock(a, b, w) {
  const f = w.maxHp ? w.hp / w.maxHp : 1, top = (w.h ?? RobotGfx.WALL_HEIGHT) * (0.45 + 0.55 * f);
  let t0 = 0, t1 = 0.97;
  for (const [o, d, lo, hi] of [[a[0], b[0] - a[0], w.x0, w.x1], [a[1], b[1] - a[1], 0, top], [a[2], b[2] - a[2], w.z0, w.z1]]) {
    if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) return false; continue; }
    let u = (lo - o) / d, v = (hi - o) / d;
    if (u > v) [u, v] = [v, u];
    t0 = Math.max(t0, u); t1 = Math.min(t1, v);
    if (t0 > t1) return false;
  }
  return true;
}

function scoreView(c) {
  const eye = camEye(c.yaw, c.pitch);
  let seen = 0;
  for (const r of game.robots) {
    if (r.dying !== null) continue;
    for (const y of [0.7, 1.6]) {
      const p = [r.x, y, r.z];
      const x0 = Math.min(eye[0], p[0]), x1 = Math.max(eye[0], p[0]), z0 = Math.min(eye[2], p[2]), z1 = Math.max(eye[2], p[2]);
      if (!game.walls.some((w) => w.x1 > x0 && w.x0 < x1 && w.z1 > z0 && w.z0 < z1 && segHitsBlock(eye, p, w))) seen += 0.5;
    }
  }
  return seen;
}

function updateAutoCam(dt) {
  if (game.phase !== 'battle' || drag || performance.now() < autoCam.holdUntil) return;
  const cs = autoCam.candidates;
  for (let k = 0; k < 8; k++) { const c = cs[autoCam.next]; c.score = scoreView(c); autoCam.next = (autoCam.next + 1) % cs.length; }
  // Prefer low views and little turning; only switch target for a clearly better view.
  const value = (c) => c.score - (c.pitch - 0.85) * 0.8 - Math.abs(angDiff(yaw, c.yaw)) * 0.12;
  const best = cs.reduce((a, b) => (value(b) > value(a) ? b : a));
  if (!autoCam.target || value(best) > value(autoCam.target) + 0.5) autoCam.target = best;
  const t = autoCam.target, ease = Math.min(1, dt * 0.6);
  yaw += clamp(angDiff(yaw, t.yaw) * ease, -0.4 * dt, 0.4 * dt);
  pitch += clamp((t.pitch - pitch) * ease, -0.2 * dt, 0.2 * dt);

  const alive = game.robots.filter((r) => r.dying === null);
  if (!alive.length) return;
  const xs = alive.map((r) => r.x), zs = alive.map((r) => r.z);
  const mx = (Math.min(...xs) + Math.max(...xs)) / 2, mz = (Math.min(...zs) + Math.max(...zs)) / 2;
  const pan = Math.min(1, dt * 0.8);
  camCenter.x += clamp((mx - camCenter.x) * pan, -6 * dt, 6 * dt);
  camCenter.z += clamp((mz - camCenter.z) * pan, -6 * dt, 6 * dt);
  const want = fitDist(alive.flatMap((r) => [[r.x, 0, r.z], [r.x, 2.6, r.z]]));
  dist += clamp((want - dist) * Math.min(1, dt * 0.7), -8 * dt, 8 * dt);
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  autoCam.holdUntil = performance.now() + 6000;
  dist = Math.max(6, Math.min(maxCamDist(), dist * (1 + e.deltaY * 0.001)));
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.target.closest('select, button, input')) return;
  if (e.code === 'Escape' && phase !== 'setup' && confirm('Stop the current battle?')) { paused = false; document.getElementById('results').hidden = true; roundOverPending = false; roundOverTimer = 0; newRound(); showSetup(); }
  if (e.code === 'Space') paused = !paused;
  if (e.code === 'KeyM') muted = !muted;
});

// ---------- sound ----------
let audio = null, noise = null, muted = false;
function unlockAudio() {
  if (!audio) {
    audio = new AudioContext();
    noise = audio.createBuffer(1, audio.sampleRate * 1.5, audio.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audio.state === 'suspended') audio.resume();
}
addEventListener('pointerdown', unlockAudio);
addEventListener('keydown', unlockAudio);

// A deep thump with a noisy crack on top, for a mine going off.
function playBoom() {
  if (!audio || muted || audio.state !== 'running') return;
  const now = audio.currentTime;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, now);
  osc.frequency.exponentialRampToValueAtTime(35, now + 0.5);
  g.gain.setValueAtTime(0.6, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  osc.connect(g).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 0.6);
  playCrumble();
}

// A low, crunchy rumble of filtered noise for a wall block collapsing.
function playCrumble() {
  if (!audio || muted || audio.state !== 'running') return;
  const now = audio.currentTime;
  for (let k = 0; k < 4; k++) {
    const t = now + k * 0.05 + Math.random() * 0.04;
    const src = audio.createBufferSource(), lp = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = noise;
    lp.type = 'lowpass';
    lp.frequency.value = 500 + Math.random() * 500;
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    src.connect(lp).connect(g).connect(audio.destination);
    src.start(t);
  }
}

// A missile hitting a robot: a sharp crack, a low thump that drops in pitch, a rumbling tail
// that darkens as it dies away, and a faint ring from the armour. Built on any audio context
// so it can also be rendered offline.
function missileHitSound(ctx, dest, noiseBuf, t0) {
  const v = 0.85 + Math.random() * 0.3; // a little different every time
  const out = ctx.createGain();
  out.gain.value = 0.3;
  out.connect(dest);
  const noiseThrough = (filters, gain, decay, offset = Math.random()) => {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = noiseBuf;
    let node = src;
    for (const f of filters) node = node.connect(f);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
    node.connect(g).connect(out);
    src.start(t0, offset * 0.3);
    src.stop(t0 + decay + 0.05);
  };
  const filter = (type, freq, q = 0.7) => { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };

  // crack
  noiseThrough([filter('highpass', 1800 * v)], 0.9, 0.07);
  // body and rumble: low-passed noise whose cutoff falls as it fades
  const sweep = filter('lowpass', 2500 * v);
  sweep.frequency.setValueAtTime(2500 * v, t0);
  sweep.frequency.exponentialRampToValueAtTime(180, t0 + 0.6);
  noiseThrough([sweep], 1.0, 0.75);
  // thump
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(95 * v, t0);
  osc.frequency.exponentialRampToValueAtTime(32, t0 + 0.3);
  g.gain.setValueAtTime(0.9, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
  osc.connect(g).connect(out);
  osc.start(t0);
  osc.stop(t0 + 0.45);
  // armour ring, quiet
  for (const [freq, amp, decay] of [[540, 0.07, 0.3], [1370, 0.04, 0.2]]) {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq * v;
    og.gain.setValueAtTime(amp, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
    o.connect(og).connect(out);
    o.start(t0);
    o.stop(t0 + decay);
  }
}

function playMissileHit() {
  if (!audio || muted || audio.state !== 'running') return;
  missileHitSound(audio, audio.destination, noise, audio.currentTime);
}

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

// ---------- main loop ----------
let last = performance.now(), simTime = 0, rafId = 0;
function schedulePreview() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(frame);
}
function frame(now) {
  rafId = 0;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused && phase !== 'setup') { update(dt); simTime += dt; updateAutoCam(dt); }

  resize();
  const dpr = canvas.width / canvas.clientWidth;
  const panelPx = watchedRobots.length > 0 ? Math.round(284 * dpr) : 0;
  const mainW = canvas.width - panelPx;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.8, 0.84, 0.9, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.viewport(0, 0, mainW, canvas.height);

  if (phase === 'setup') { // the preview shows the whole arena, at the zoom from before the battle
    camCenter.x = 0; camCenter.z = 0;
    if (autoCam.savedDist != null) { dist = autoCam.savedDist; autoCam.savedDist = null; }
  }
  camAspect = mainW / canvas.height;
  const eye = camEye(yaw, pitch);
  const view = mat4.lookAt(eye, camTarget(), [0, 1, 0]);
  const proj = mat4.perspective(CAM_FOV, camAspect, 0.5, 500);
  gfx.begin(mat4.mul(proj, view), eye);
  gfx.drawArena(game.arena, GROUND_KINDS[config.ground]);
  gfx.drawWalls(game.walls);
  for (const m of game.mines) gfx.drawMine(m, simTime);
  for (const p of radioPulses) gfx.drawRadioPulse(p);
  for (const r of game.robots) gfx.drawRadar(r);
  for (const r of game.robots) gfx.drawRobot(r, simTime);
  for (const b of game.bullets) gfx.drawBullet(b);
  for (const i of impacts) gfx.drawImpact(i);
  for (const e of explosions) gfx.drawExplosion(e);
  for (const c of crumbles) gfx.drawCrumble(c);

  if (watchedRobots.length > 0 && game.phase === 'battle') {
    const sx = canvas.width / canvas.clientWidth, sy = canvas.height / canvas.clientHeight;
    const ports = document.getElementById('eyepanel').querySelectorAll('.eyeslot-port');
    for (let vi = 0; vi < watchedRobots.length; vi++) {
      const r = watchedRobots[vi];
      const port = ports[vi];
      if (!port) continue;
      const rect = port.getBoundingClientRect();
      const pw = Math.round(rect.width * sx), ph = Math.round(rect.height * sy);
      const px = Math.round(rect.left * sx);
      const py = Math.round(canvas.height - rect.bottom * sy);
      if (pw <= 0 || ph <= 0 || py < 0 || px < 0 || px + pw > canvas.width || py + ph > canvas.height) continue;
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(px, py, pw, ph);
      gl.viewport(px, py, pw, ph);
      gl.clearColor(0.12, 0.15, 0.22, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const eyePos = [r.x, 1.6, r.z];
      const lookPt = [r.x + Math.sin(r.turret) * 10, 1.6, r.z + Math.cos(r.turret) * 10];
      const eyeView = mat4.lookAt(eyePos, lookPt, [0, 1, 0]);
      const eyeProj = mat4.perspective((65 * Math.PI) / 180, pw / ph, 0.3, 200);
      gfx.begin(mat4.mul(eyeProj, eyeView), eyePos);
      gfx.drawArena(game.arena, GROUND_KINDS[config.ground]);
      gfx.drawWalls(game.walls);
      for (const m of game.mines) gfx.drawMine(m, simTime);
      for (const p of radioPulses) gfx.drawRadioPulse(p);
      for (const rb of game.robots) if (rb !== r) gfx.drawRobot(rb, simTime);
      for (const b of game.bullets) gfx.drawBullet(b);
      for (const i of impacts) gfx.drawImpact(i);
      for (const e of explosions) gfx.drawExplosion(e);
      for (const c of crumbles) gfx.drawCrumble(c);
      gl.disable(gl.SCISSOR_TEST);
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  if (phase !== 'setup') rafId = requestAnimationFrame(frame);
}
schedulePreview(); // initial arena preview
</script>
</body>
</html>
